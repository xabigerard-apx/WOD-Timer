<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="APX Remote">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#613795">
  <title>APX Remote</title>

  <!-- Icons & PWA Manifest -->
  <link rel="icon" type="image/png" href="remote-logo.png">
  <link rel="apple-touch-icon" href="remote-logo.png">
  <link rel="manifest" href="manifest-remote.json">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500;700&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #0d0d12;
      --surface: #171720;
      --surface-card: #201f2e;
      --border: #2c2a3e;
      --accent-purple: #8c52ff;
      --accent-amrap: #e8ff00;
      --accent-emom: #00d4ff;
      --accent-fortime: #ff4d00;
      --accent-tabata: #ff2d78;
      --accent-custom: #bf5af2;
      --accent-sets: #30d158;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text: #f3f4f6;
      --muted: #8b889e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      height: 100vh;
      height: 100dvh;
      max-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      overscroll-behavior: none;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    header {
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
      z-index: 50;
    }
    .brand-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      letter-spacing: 2px;
      color: #fff;
      line-height: 1;
    }
    .brand-title span { color: var(--accent-purple); }

    .status-pill {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      background: #1c1c28;
      border: 1px solid var(--border);
      color: var(--muted);
      transition: all 0.2s;
    }
    .status-pill.online {
      color: #30d158;
      border-color: #30d158;
      background: rgba(48, 209, 88, 0.1);
    }

    /* Top Navigation (Setup vs Saved vs Settings) */
    .top-nav {
      display: flex;
      gap: 8px;
      padding: 8px 16px 0;
      flex-shrink: 0;
    }
    .nav-btn {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      padding: 8px 4px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: center;
    }
    .nav-btn.active {
      background: var(--surface-card);
      color: #fff;
      border-color: var(--accent-purple);
    }

    .view-container {
      padding: 10px 16px 12px;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .section-title {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    /* Modes Selection Grid */
    .modes-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .mode-tab {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 8px 4px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }
    .mode-tab.active {
      border-color: var(--active-color, var(--accent-purple));
      background: var(--surface-card);
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    }
    .mode-tab .name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      letter-spacing: 1px;
      color: #fff;
      display: block;
      line-height: 1.1;
    }

    /* Configuration Card */
    .config-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      overflow-y: auto;
    }

    .field-label {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 1.5px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 4px;
      display: block;
    }

    .stepper {
      display: flex;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .stepper:last-child { margin-bottom: 0; }

    .step-btn {
      width: 44px;
      height: 38px;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .step-btn:active { background: rgba(255,255,255,0.06); }

    /* Editable Numeric Input */
    .step-val-input {
      flex: 1;
      width: 100%;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      text-align: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 26px;
      color: #fff;
      letter-spacing: 1px;
      user-select: text;
      -webkit-user-select: text;
      padding: 0;
      margin: 0;
      border-bottom: 2px solid transparent;
      transition: border-color 0.2s, background-color 0.2s;
    }
    .step-val-input:focus {
      background: rgba(140, 82, 255, 0.1);
      border-bottom-color: var(--accent-purple);
    }
    .step-val-input::-webkit-outer-spin-button,
    .step-val-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .step-val-input[type=number] {
      -moz-appearance: textfield;
    }

    .step-unit {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      padding-right: 10px;
      flex-shrink: 0;
    }

    .row-split {
      display: flex;
      gap: 8px;
    }
    .row-split .stepper { flex: 1; }

    .segmented {
      display: flex;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      gap: 4px;
      margin-bottom: 8px;
    }
    .segmented:last-child { margin-bottom: 0; }

    .seg-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      padding: 7px 4px;
      border-radius: 7px;
      cursor: pointer;
    }
    .seg-btn.active {
      background: var(--surface-card);
      color: #fff;
    }

    /* Custom Interval Section & Editor */
    .custom-list-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .custom-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
      transition: border-color 0.15s;
      flex-shrink: 0;
    }
    .custom-item:active { border-color: var(--accent-purple); }
    .custom-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .custom-name {
      flex: 1;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .custom-dur {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      background: var(--surface);
      padding: 2px 7px;
      border-radius: 6px;
    }
    .btn-del-iv {
      background: none;
      border: none;
      color: var(--danger);
      font-size: 19px;
      line-height: 1;
      padding: 0 4px;
      cursor: pointer;
    }
    .btn-add-iv {
      width: 100%;
      background: transparent;
      border: 1px dashed var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      padding: 10px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .btn-add-iv:active { border-color: var(--accent-purple); }

    .iv-editor {
      background: var(--surface-card);
      border: 1px solid var(--accent-purple);
      border-radius: 12px;
      padding: 10px;
      flex-shrink: 0;
    }
    .editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .editor-title {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      color: var(--accent-purple);
      letter-spacing: 1px;
    }
    .text-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      outline: none;
      margin-bottom: 8px;
      user-select: text;
      -webkit-user-select: text;
    }
    .text-input:focus { border-color: var(--accent-purple); }
    .color-swatches {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    .swatch {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .swatch.selected {
      border-color: #fff;
      transform: scale(1.15);
      box-shadow: 0 0 8px rgba(255,255,255,0.4);
    }
    .editor-actions {
      display: flex;
      gap: 8px;
    }
    .btn-cancel {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      padding: 8px;
      cursor: pointer;
    }
    .btn-save-iv {
      flex: 2;
      background: var(--accent-sets);
      border: none;
      border-radius: 8px;
      color: #000;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 17px;
      letter-spacing: 1px;
      padding: 6px;
      cursor: pointer;
    }

    /* Bottom Action Row */
    .action-row {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    .btn-launch {
      flex: 2;
      background: linear-gradient(135deg, #30d158, #16a34a);
      color: #000;
      border: none;
      border-radius: 12px;
      padding: 13px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(48, 209, 88, 0.3);
    }
    .btn-save-w {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
    }

    /* SAVED VIEW */
    #view-saved {
      display: none;
      padding: 12px 16px;
      flex: 1;
      min-height: 0;
      flex-direction: column;
      overflow: hidden;
    }
    #savedListContainer {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }
    .saved-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .saved-info-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 19px;
      letter-spacing: 1px;
      color: #fff;
    }
    .saved-info-meta {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }
    .saved-btns {
      display: flex;
      gap: 8px;
    }
    .saved-load-btn {
      background: var(--accent-purple);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      cursor: pointer;
    }
    .saved-del-btn {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 14px;
      cursor: pointer;
    }

    /* SETTINGS VIEW */
    #view-settings {
      display: none;
      padding: 12px 16px;
      flex: 1;
      min-height: 0;
      flex-direction: column;
      overflow: hidden;
    }
    #view-settings .config-card {
      justify-content: flex-start;
      margin-bottom: 0;
    }
    #view-settings .btn-launch,
    #view-settings .btn-stop {
      flex: none;
      padding: 10px 14px;
      font-size: 17px;
      letter-spacing: 1.5px;
      box-shadow: none;
    }
    .volume-slider {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 6px; border-radius: 3px;
      background: var(--surface-card); outline: none; margin-top: 6px; margin-bottom: 12px;
    }
    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 20px; height: 20px; border-radius: 50%;
      background: var(--accent-purple); cursor: pointer;
    }

/* Miniatures Affiches Promo */
    .promo-thumbs-grid {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .promo-thumb-item {
      position: relative;
      width: 62px;
      height: 62px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
    }
    .promo-thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .promo-thumb-del {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.92);
      color: #fff;
      border: none;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    

    /* LIVE REMOTE VIEW */
    #view-live {
      display: none;
      padding: 14px 16px;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      justify-content: space-between;
      overflow: hidden;
    }

    .live-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px 16px;
      text-align: center;
      margin-bottom: 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .live-mode-badge {
      display: inline-block;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      letter-spacing: 2px;
      padding: 4px 14px;
      border-radius: 20px;
      background: #252336;
      color: var(--accent-purple);
      margin-bottom: 10px;
    }
    .live-timer-digits {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(76px, 22vw, 110px);
      letter-spacing: 2px;
      line-height: 0.9;
      color: #fff;
      margin: 8px 0;
      font-variant-numeric: tabular-nums;
    }
    .live-status-sub {
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      letter-spacing: 2px;
      color: var(--muted);
    }

    .live-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }
    .btn-contextual {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      letter-spacing: 2px;
      cursor: pointer;
    }
    .btn-split { background: var(--accent-fortime); color: #fff; }
    .btn-round { background: var(--accent-amrap); color: #000; }
    .btn-set { background: var(--accent-sets); color: #000; }

    .live-row-btns {
      display: flex;
      gap: 10px;
    }
    .btn-pause {
      flex: 1;
      background: var(--warning);
      color: #000;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 1.5px;
      cursor: pointer;
    }
    .btn-stop {
      flex: 1;
      background: #232230;
      color: var(--danger);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 1.5px;
      cursor: pointer;
    }
  </style>

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
</head>
<body>

  <header>
    <div class="brand-title">APX <span>REMOTE</span></div>
    <div class="status-pill" id="connPill">Connecting...</div>
  </header>

  <!-- TOP TABS -->
  <div class="top-nav" id="topNav">
    <button class="nav-btn active" id="tabNavSetup" onclick="switchMainTab('setup')">SETUP</button>
    <button class="nav-btn" id="tabNavSaved" onclick="switchMainTab('saved')">⭐ SAVED</button>
    <button class="nav-btn" id="tabNavSettings" onclick="switchMainTab('settings')">⚙️ SETTINGS</button>
  </div>

  <!-- SETUP VIEW -->
  <div class="view-container" id="view-setup">
    <div class="section-title">Workout Mode</div>
    
    <div class="modes-grid">
      <div class="mode-tab active" data-mode="fortime" style="--active-color: var(--accent-fortime)" onclick="selectMode('fortime')">
        <span class="name">FOR TIME</span>
      </div>
      <div class="mode-tab" data-mode="amrap" style="--active-color: var(--accent-amrap)" onclick="selectMode('amrap')">
        <span class="name">AMRAP</span>
      </div>
      <div class="mode-tab" data-mode="emom" style="--active-color: var(--accent-emom)" onclick="selectMode('emom')">
        <span class="name">EMOM</span>
      </div>
      <div class="mode-tab" data-mode="tabata" style="--active-color: var(--accent-tabata)" onclick="selectMode('tabata')">
        <span class="name">TABATA</span>
      </div>
      <div class="mode-tab" data-mode="sets" style="--active-color: var(--accent-sets)" onclick="selectMode('sets')">
        <span class="name">SETS</span>
      </div>
      <div class="mode-tab" data-mode="custom" style="--active-color: var(--accent-custom)" onclick="selectMode('custom')">
        <span class="name">CUSTOM</span>
      </div>
    </div>

    <!-- Dynamic Form Card -->
    <div class="config-card" id="form-container"></div>

    <div class="action-row">
      <button class="btn-save-w" onclick="promptSaveWorkout()">⭐ SAVE</button>
      <button class="btn-launch" onclick="launchWorkoutOnTV()">START ON TV</button>
    </div>
  </div>

  <!-- SAVED TIMERS VIEW -->
  <div id="view-saved">
    <div class="section-title">Saved Workouts</div>
    <div id="savedListContainer"></div>
  </div>

  <!-- SETTINGS VIEW -->
  <div id="view-settings">
    <div class="section-title">Display Settings</div>
    <div class="config-card">
      <label class="field-label">Countdown Duration</label>
      <div class="stepper">
        <button class="step-btn" onclick="adjSetting('countdown', -1, 0, 10)">−</button>
        <input type="number" inputmode="numeric" pattern="[0-9]*" class="step-val-input" id="val-setCountdown" value="3" onfocus="this.select()" oninput="manualSetSetting('countdown', this.value, 0, 10)">
        <span class="step-unit">SEC</span>
        <button class="step-btn" onclick="adjSetting('countdown', 1, 0, 10)">+</button>
      </div>

      <label class="field-label">Warn When Time Remaining</label>
      <div class="stepper">
        <button class="step-btn" onclick="adjSetting('warnAt', -1, 1, 60)">−</button>
        <input type="number" inputmode="numeric" pattern="[0-9]*" class="step-val-input" id="val-setWarnAt" value="10" onfocus="this.select()" oninput="manualSetSetting('warnAt', this.value, 1, 60)">
        <span class="step-unit">SEC</span>
        <button class="step-btn" onclick="adjSetting('warnAt', 1, 1, 60)">+</button>
      </div>

      <label class="field-label">TIME! / DONE! Screen Duration</label>
      <div class="stepper">
        <button class="step-btn" onclick="adjSetting('finishDuration', -5, 5, 300)">−</button>

  <script>
    // Firebase Configuration APX
    const firebaseConfig = {

    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Mode Test isolé (?test=1)
    const isTestMode = new URLSearchParams(window.location.search).get("test") === "1";
    const prefix = isTestMode ? "test_" : "";

    const timerRef = db.ref(prefix + "timer_state");
    const CURRENT_VERSION = "v1.3";
    const versionRef = db.ref("app_version");

    versionRef.on("value", (snap) => {
      if (isTestMode) return;
      const latestVersion = String(snap.val() || "");
      if (!latestVersion) {
        versionRef.set(CURRENT_VERSION);
        return;
      }
      const url = new URL(window.location.href);
      if (latestVersion !== CURRENT_VERSION && url.searchParams.get("v") !== latestVersion) {
        url.searchParams.set("v", latestVersion);
        window.location.replace(url.toString());
      }
    });

    const settingsRef = db.ref(prefix + "timer_settings");

    // Vérification Wi-Fi du gym (IP publique)
    const gymIpRef = db.ref("gym_ip");
    let gymIp = null;
    let myIp = null;
    let isAtGym = false;

    function updateGymConnectionStatus() {
      const pill = document.getElementById('connPill');
      if (isTestMode) {
        pill.innerText = "🛠️ Mode Test";
        pill.classList.remove('online');
        pill.style.color = "#8c52ff";
        pill.style.borderColor = "#8c52ff";
        return;
      }
      if (!gymIp || !myIp) return; // En attente de vérification

      if (myIp === gymIp) {
        isAtGym = true;
        pill.innerText = "TV Connected";
        pill.classList.add('online');
        pill.style.color = "";
        pill.style.borderColor = "";
      } else {
        isAtGym = false;
        pill.innerText = "🔒 Hors-Gym";
        pill.classList.remove('online');
        pill.style.color = "#f59e0b";
        pill.style.borderColor = "#f59e0b";
      }
    }

    updateGymConnectionStatus();

    gymIpRef.on("value", (snap) => {
      gymIp = snap.val();
      updateGymConnectionStatus();
    });

    fetch("https://api.ipify.org?format=json")
      .then(res => res.json())
      .then(data => {
        if (data && data.ip) {
          myIp = data.ip;
          updateGymConnectionStatus();
        }
      })
      .catch(() => {
        // En cas de coupure d'ipify, on ne bloque pas le gym
        isAtGym = true;
      });

    function canControlTV() {
      // Sécurité : en mode test ou si gym_ip n'est pas encore enregistré, on laisse passer
      if (isTestMode || !gymIp) return true;
      if (!isAtGym) {
        alert("🔒 Action bloquée : tu dois être connecté au Wi-Fi du gym pour contrôler la télé.");
        return false;

      return (config.emomIvMin * 60) + config.emomIvSec || 60;

      const totalSec = Math.floor(ms / 1000);
      const m = Math.floor(totalSec / 60);

      } else if (currentMode === 'emom') {

            <div class="stepper">
              <button class="step-btn" onclick="adjEmomInterval('emomIvSec', -5, 0, 55)">−</button>
              <input type="number" inputmode="numeric" pattern="[0-9]*" class="step-val-input" id="val-emomIvSec" value="${config.emomIvSec}" onfocus="this.select()" oninput="manualSetEmomInterval('emomIvSec', this.value, 0, 55)">
              <span class="step-unit">SEC</span>

          </div>

            <button class="step-btn" onclick="adjEmomRounds(1)">+</button>
          </div>

          <label class="field-label">Total Duration</label>

              <label class="field-label">Work</label>

                <button class="step-btn" onclick="adj('tabWork', -5, 5, 180)">−</button>
                <input type="number" inputmode="numeric" pattern="[0-9]*" class="step-val-input" id="val-tabWork" value="${config.tabWork}" onfocus="this.select()" oninput="manualSet('tabWork', this.value, 5, 180)">
                <span class="step-unit">S</span>
                <button class="step-btn" onclick="adj('tabWork', 5, 5, 180)">+</button>
              </div>
            </div>

              <label class="field-label">Rest</label>
              <div class="stepper">

                <input type="number" inputmode="numeric" pattern="[0-9]*" class="step-val-input" id="val-tabRest" value="${config.tabRest}" onfocus="this.select()" oninput="manualSet('tabRest', this.value, 0, 180)">
                <span class="step-unit">S</span>
                <button class="step-btn" onclick="adj('tabRest', 5, 0, 180)">+</button>

            </div>
          </div>
        `;
      } else if (currentMode === 'sets') {

          <div class="stepper">
            <button class="step-btn" onclick="adj('setsCount', -1, 1, 30)">−</button>
            <input type="number" inputmode="numeric" pattern="[0-9]*" class="step-val-input" id="val-setsCount" value="${config.setsCount}" onfocus="this.select()" oninput="manualSet('setsCount', this.value, 1, 30)">
            <span class="step-unit">SETS</span>
            <button class="step-btn" onclick="adj('setsCount', 1, 1, 30)">+</button>

          <div class="segmented">
            <button class="seg-btn ${config.restType === '1to1' ? 'active' : ''}" onclick="setRest('1to1')">1:1 REST</button>
            <button class="seg-btn ${config.restType === 'fixed' ? 'active' : ''}" onclick="setRest('fixed')">FIXED</button>
            <button class="seg-btn ${config.restType === 'none' ? 'active' : ''}" onclick="setRest('none')">NONE</button>
          </div>
          <div id="fixed-box" style="display:${config.restType === 'fixed' ? 'flex' : 'none'}; gap:8px;">
            <div class="stepper" style="flex:1; margin-bottom:0;">
              <button class="step-btn" onclick="adj('restMin', -1, 0, 59)">−</button>
              <input type="number" inputmode="numeric" pattern="[0-9]*" class="step-val-input" id="val-restMin" value="${config.restMin}" onfocus="this.select()" oninput="manualSet('restMin', this.value, 0, 59)">
              <span class="step-unit">MIN</span>
              <button class="step-btn" onclick="adj('restMin', 1, 0, 59)">+</button>

              <span class="step-unit">SEC</span>
              <button class="step-btn" onclick="adj('restSec', 5, 0, 55)">+</button>
            </div>
          </div>
        `;

        if (editingIdx !== null) {

                </div>

    function selectMode(m) {
      currentMode = m;
      editingIdx = null;
      document.querySelectorAll('.mode-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.mode === m);
      });
      renderForm();
    }

    function adj(key, delta, min, max) {
      config[key] = Math.max(min, Math.min(max, (config[key] || 0) + delta));
      const el = document.getElementById(`val-${key}`);
      if (el) el.value = config[key];
    }

    function manualSet(key, rawVal, min, max) {
      if (rawVal === '') return;
      let parsed = parseInt(rawVal);
      if (isNaN(parsed)) parsed = min;
      config[key] = Math.max(min, Math.min(max, parsed));
    }

    // EMOM Bidirectional Logic
    function adjEmomInterval(key, delta, min, max) {
      config[key] = Math.max(min, Math.min(max, (config[key] || 0) + delta));
      if (config.emomIvMin === 0 && config.emomIvSec === 0) config.emomIvSec = 30;
      const el = document.getElementById(`val-${key}`);
      if (el) el.value = config[key];
      recalcEmomMinsFromRounds();
    }

    function manualSetEmomInterval(key, rawVal, min, max) {
      if (rawVal === '') return;
      let parsed = parseInt(rawVal);
      if (isNaN(parsed)) parsed = min;
      config[key] = Math.max(min, Math.min(max, parsed));
      if (config.emomIvMin === 0 && config.emomIvSec === 0) config.emomIvSec = 30;
      recalcEmomMinsFromRounds();
    }

    function adjEmomRounds(delta) {
      config.emomRounds = Math.max(1, Math.min(99, config.emomRounds + delta));
      const el = document.getElementById('val-emomRounds');
      if (el) el.value = config.emomRounds;
      recalcEmomMinsFromRounds();
    }

    function manualSetEmomRounds(rawVal) {
      if (rawVal === '') return;
      let parsed = parseInt(rawVal);
      if (isNaN(parsed)) parsed = 1;
      config.emomRounds = Math.max(1, Math.min(99, parsed));
      recalcEmomMinsFromRounds();
    }

    function recalcEmomMinsFromRounds() {
      const ivSec = getEmomIntervalSec();
      const totalSec = ivSec * config.emomRounds;
      config.emomMins = Math.ceil(totalSec / 60);
      const el = document.getElementById('val-emomMins');
      if (el) el.value = config.emomMins;
    }

    function adjEmomMins(delta) {
      config.emomMins = Math.max(1, Math.min(99, config.emomMins + delta));
      const el = document.getElementById('val-emomMins');
      if (el) el.value = config.emomMins;
      recalcEmomRoundsFromMins();
    }

    function manualSetEmomMins(rawVal) {
      if (rawVal === '') return;
      let parsed = parseInt(rawVal);
      if (isNaN(parsed)) parsed = 1;
      config.emomMins = Math.max(1, Math.min(99, parsed));
      recalcEmomRoundsFromMins();
    }

    function recalcEmomRoundsFromMins() {
      const ivSec = getEmomIntervalSec();
      const totalSec = config.emomMins * 60;
      config.emomRounds = Math.max(1, Math.floor(totalSec / ivSec));
      const el = document.getElementById('val-emomRounds');
      if (el) el.value = config.emomRounds;
    }

    function setSplits(val) {
      config.ftSplits = val;
      renderForm();
    }

    function setRest(val) {
      config.restType = val;
      renderForm();
    }

    // Custom Interval Editor Handlers
    function openNewIntervalEditor() {
      editingIdx = -1;
      draftIv = {
        name: "",
        mins: 0,
        secs: 0,
        color: "#e8ff00"
      };
      renderForm();
      setTimeout(() => document.getElementById('ivNameInput')?.focus(), 50);
    }

    function openEditIntervalEditor(idx) {
      const item = config.customIntervals[idx];
      if (!item) return;
      const totalSec = Math.floor(item.duration / 1000);
      editingIdx = idx;
      draftIv = {
        name: item.name,
        mins: Math.floor(totalSec / 60),
        secs: totalSec % 60,
        color: item.color || "#e8ff00"
      };
      renderForm();
    }

    function closeEditor() {
      editingIdx = null;
      renderForm();
    }

    function adjDraftTime(field, delta, max) {
      draftIv[field] = Math.max(0, Math.min(max, (draftIv[field] || 0) + delta));
      const el = document.getElementById(field === 'mins' ? 'ivMinsInput' : 'ivSecsInput');
      if (el) el.value = draftIv[field];
    }

    function setDraftTimeManual(field, rawVal, max) {
      if (rawVal === '') { draftIv[field] = 0; return; }
      const parsed = parseInt(rawVal);
      draftIv[field] = isNaN(parsed) ? 0 : Math.max(0, Math.min(max, parsed));
    }

    function selectDraftColor(hex) {
      draftIv.color = hex;
      document.querySelectorAll('.swatch').forEach(el => {
        el.classList.toggle('selected', el.dataset.color === hex);
      });
    }

    function saveDraftInterval() {
      const nameInput = document.getElementById('ivNameInput');
      const finalName = (nameInput ? nameInput.value.trim() : draftIv.name.trim()) || "Work";
      const totalMs = ((draftIv.mins * 60) + draftIv.secs) * 1000;

      if (totalMs <= 0) {
        alert("La durée doit être supérieure à 0:00.");
        return;
      }

      const entry = {
        name: finalName,
        duration: totalMs,
        color: draftIv.color
      };

      if (editingIdx === -1) {
        config.customIntervals.push(entry);
      } else if (editingIdx >= 0) {
        config.customIntervals[editingIdx] = entry;
      }

      editingIdx = null;
      renderForm();
    }

    function removeCustomIv(e, idx) {
      e.stopPropagation();
      config.customIntervals.splice(idx, 1);
      if (editingIdx === idx) editingIdx = null;
      renderForm();
    }

// Shared Firebase Saved Workouts (synchronisé entre tous les coachs)
    const savedWorkoutsRef = db.ref(prefix + "saved_workouts");
    let sharedSavedWorkouts = [];

    savedWorkoutsRef.on("value", (snap) => {
      const val = snap.val();
      if (!val) {
        sharedSavedWorkouts = [];
      } else {
        const list = Array.isArray(val) ? val : Object.values(val);
        sharedSavedWorkouts = list.filter(Boolean).sort((a, b) => (b.id || 0) - (a.id || 0));
      }
      if (document.getElementById('tabNavSaved')?.classList.contains('active')) {
        renderSavedList();
      }
    });

    function promptSaveWorkout() {
      if (currentMode === 'custom' && config.customIntervals.length === 0) {
        alert("Ajoute au moins un intervalle avant de sauvegarder.");
        return;
      }
      const name = prompt("Workout name (e.g. Mercredi - EMOM 1:30 x 20, Fran, etc.):");
      if (!name) return;

      const id = Date.now();
      const entry = {
        id: id,
        name: name.trim(),
        mode: currentMode,
        config: JSON.parse(JSON.stringify(config))
      };

      savedWorkoutsRef.child(String(id)).set(entry).then(() => {
        alert("Workout sauvegardé et partagé avec tous les coachs !");
      });
    }

    function renderSavedList() {
      const c = document.getElementById('savedListContainer');
      if (!sharedSavedWorkouts.length) {
        c.innerHTML = `<div style="text-align:center;color:var(--muted);margin-top:40px;font-size:13px;">No saved workouts yet.</div>`;
        return;
      }
      c.innerHTML = sharedSavedWorkouts.map(item => `
        <div class="saved-card">
          <div>
            <div class="saved-info-name">${item.name}</div>
            <div class="saved-info-meta">${item.mode.toUpperCase()}</div>
          </div>
          <div class="saved-btns">
            <button class="saved-load-btn" onclick="loadSavedWorkout(${item.id})">LOAD</button>
            <button class="saved-del-btn" onclick="deleteSavedWorkout(${item.id})">🗑️</button>
          </div>
        </div>
      `).join('');
    }

    function loadSavedWorkout(id) {
      const found = sharedSavedWorkouts.find(s => s.id === id);
      if (!found) return;
      currentMode = found.mode;
      const loadedCfg = JSON.parse(JSON.stringify(found.config || {}));
      if (loadedCfg.customIntervals && !Array.isArray(loadedCfg.customIntervals)) {
        loadedCfg.customIntervals = Object.values(loadedCfg.customIntervals);
      } else if (!loadedCfg.customIntervals) {
        loadedCfg.customIntervals = [];
      }
      config = { ...config, ...loadedCfg };
      switchMainTab('setup');
      selectMode(currentMode);
    }

    function deleteSavedWorkout(id) {
      if (!confirm("Supprimer ce timer pour tous les coachs ?")) return;
      savedWorkoutsRef.child(String(id)).remove();
    }

    // Settings Tab Handlers
    function adjSetting(key, delta, min, max) {
      tvSettings[key] = Math.max(min, Math.min(max, (tvSettings[key] || 0) + delta));
      const el = document.getElementById(`val-set${key.charAt(0).toUpperCase() + key.slice(1)}`);
      if (el) el.value = tvSettings[key];
    }

    function manualSetSetting(key, rawVal, min, max) {
      if (rawVal === '') return;
      let parsed = parseInt(rawVal);
      if (isNaN(parsed)) parsed = min;
      tvSettings[key] = Math.max(min, Math.min(max, parsed));
    }

    function toggleSettingBool(key, val) {
      tvSettings[key] = val;
      const isBeep = key === 'beep';
      document.getElementById(isBeep ? 'btnBeepYes' : 'btnFlashYes').classList.toggle('active', val);
      document.getElementById(isBeep ? 'btnBeepNo' : 'btnFlashNo').classList.toggle('active', !val);
    }

    function saveAndSyncSettings() {
      if (!canControlTV()) return;
      tvSettings.countdown = parseInt(document.getElementById('val-setCountdown').value) || 3;
      tvSettings.warnAt = parseInt(document.getElementById('val-setWarnAt').value) || 10;
      tvSettings.finishDuration = parseInt(document.getElementById('val-setFinishDuration').value) || 30;
      tvSettings.volume = (parseInt(document.getElementById('val-setVolume').value) || 70) / 100;

      settingsRef.set(tvSettings).then(() => {
        alert("Settings synced to TV!");
        switchMainTab('setup');
      });
    }

    settingsRef.once("value").then(snap => {
      const s = snap.val();
      if (s) {
        tvSettings = { ...tvSettings, ...s };
        const cdEl = document.getElementById('val-setCountdown');
        const warnEl = document.getElementById('val-setWarnAt');
        const finEl = document.getElementById('val-setFinishDuration');
        const volEl = document.getElementById('val-setVolume');
        const volLbl = document.getElementById('volLabel');
        if (cdEl) cdEl.value = tvSettings.countdown;
        if (warnEl) warnEl.value = tvSettings.warnAt;
        if (finEl) finEl.value = tvSettings.finishDuration;
        if (volEl) volEl.value = Math.round(tvSettings.volume * 100);
        if (volLbl) volLbl.textContent = Math.round(tvSettings.volume * 100) + '%';
        toggleSettingBool('beep', tvSettings.beep);
        toggleSettingBool('flash', tvSettings.flash);
      }
    });

    // Launch Workout on TV
    function launchWorkoutOnTV() {
      if (!canControlTV()) return;
      if (currentMode === 'custom' && config.customIntervals.length === 0) {
        alert("Ajoute au moins un intervalle avant de démarrer.");
        return;
      }

      let payload = {
        command: "CONFIG_AND_START",
        mode: currentMode,
        timestamp: Date.now()
      };

      if (currentMode === 'fortime') {
        payload.config = { cap: config.ftCap, splits: config.ftSplits };
      } else if (currentMode === 'amrap') {
        payload.config = { mins: config.amrapMins };
      } else if (currentMode === 'emom') {
        payload.config = { 
          mins: config.emomMins, 
          rounds: config.emomRounds, 
          ivMin: config.emomIvMin, 
          ivSec: config.emomIvSec,
          intervalMs: getEmomIntervalSec() * 1000
        };
      } else if (currentMode === 'tabata') {
        payload.config = { rounds: config.tabRounds, workSec: config.tabWork, tabRestSec: config.tabRest };
      } else if (currentMode === 'sets') {
        payload.config = { sets: config.setsCount, restType: config.restType, restMin: config.restMin, restSec: config.restSec };
      } else if (currentMode === 'custom') {
        payload.config = { loops: config.customLoops, intervals: config.customIntervals };
      }

      timerRef.update(payload);
    }

    // Realtime Firebase Listener
    timerRef.on("value", (snapshot) => {
      const data = snapshot.val();
      if (!isTestMode && (!gymIp || isAtGym)) {
        const pill = document.getElementById('connPill');
        pill.innerText = "TV Connected";
        pill.classList.add('online');
      }

      if (!data) return;

      isRunning = data.isRunning || false;
      const isCountdown = data.isCountdown || false;
      const viewSetup = document.getElementById('view-setup');
      const viewSaved = document.getElementById('view-saved');
      const viewSettings = document.getElementById('view-settings');
      const viewLive = document.getElementById('view-live');
      const topNav = document.getElementById('topNav');

      if (isRunning || isCountdown || (data.timeFormatted && data.timeFormatted !== "00:00")) {
        topNav.style.display = 'none';
        viewSetup.style.display = 'none';
        viewSaved.style.display = 'none';
        viewSettings.style.display = 'none';
        viewLive.style.display = 'flex';

        const liveDigitsEl = document.getElementById('liveDigits');
        const liveSubEl = document.getElementById('liveSub');
        const playBtn = document.getElementById('btnPlayPause');
        const ctxBtn = document.getElementById('btnContextual');

        liveDigitsEl.innerText = data.timeFormatted || "00:00";
        document.getElementById('liveBadge').innerText = data.mode || currentMode.toUpperCase();

        if (isCountdown) {
          liveDigitsEl.style.color = "var(--accent-amrap)";
          liveSubEl.innerText = "GET READY";
          playBtn.style.display = "none";
          ctxBtn.style.display = "none";
        } else {
          liveDigitsEl.style.color = "#fff";
          liveSubEl.innerText = isRunning ? "RUNNING" : "PAUSED";
          playBtn.style.display = "block";
          playBtn.innerText = isRunning ? "PAUSE" : "RESUME";
          playBtn.style.background = isRunning ? "var(--warning)" : "var(--accent-sets)";

          const activeM = (data.mode || currentMode).toUpperCase();
          if (activeM.includes('TIME')) {
            ctxBtn.style.display = 'block';
            ctxBtn.innerText = "SPLIT";
            ctxBtn.className = "btn-contextual btn-split";
          } else if (activeM.includes('AMRAP')) {
            ctxBtn.style.display = 'block';
            ctxBtn.innerText = "+1 ROUND";
            ctxBtn.className = "btn-contextual btn-round";
          } else if (activeM.includes('SETS')) {
            ctxBtn.style.display = 'block';
            ctxBtn.innerText = "DONE SET / SKIP REST";
            ctxBtn.className = "btn-contextual btn-set";
          } else {
            ctxBtn.style.display = 'none';
          }
        }

      } else {
        topNav.style.display = 'flex';
        viewLive.style.display = 'none';
        if (document.getElementById('tabNavSaved').classList.contains('active')) {
          viewSaved.style.display = 'flex';
          viewSetup.style.display = 'none';
          viewSettings.style.display = 'none';
        } else if (document.getElementById('tabNavSettings').classList.contains('active')) {
          viewSettings.style.display = 'flex';
          viewSetup.style.display = 'none';
          viewSaved.style.display = 'none';
        } else {
          viewSetup.style.display = 'flex';
          viewSaved.style.display = 'none';
          viewSettings.style.display = 'none';
        }
      }
    });

    function togglePlayPause() {
      if (!canControlTV()) return;
      timerRef.update({
        command: isRunning ? "PAUSE" : "START",
        timestamp: Date.now()
      });
    }

    function sendReset() {
      if (!canControlTV()) return;
      timerRef.update({
        command: "RESET",
        timestamp: Date.now()
      });
    }

    function sendContextAction() {
      if (!canControlTV()) return;
      timerRef.update({
        command: "CONTEXT_ACTION",
        timestamp: Date.now()
      });
    }

    // Init
    renderForm();
    
const promoRef = db.ref(prefix + "promo_banner");
    let promoData = { images: [], interval: 10 };

    promoRef.on("value", (snap) => {
      const val = snap.val();
      if (!val) {
        promoData = { images: [], interval: 10 };
      } else if (typeof val === "string") {
        // Compatibilité si une ancienne image unique est encore en base
        promoData = { images: [val], interval: 10 };
      } else {
        const imgs = val.images ? (Array.isArray(val.images) ? val.images : Object.values(val.images)) : [];
        promoData = {
          images: imgs.filter(Boolean),
          interval: parseInt(val.interval) || 10
        };
      }
      renderPromoAdmin();
    });

    function renderPromoAdmin() {
      const grid = document.getElementById("promoThumbsGrid");
      const intervalBox = document.getElementById("promoIntervalBox");
      const removeAllBtn = document.getElementById("btnRemoveAllPromo");
      const intervalInput = document.getElementById("val-promoInterval");

      if (!grid) return;

      if (promoData.images.length === 0) {
        grid.style.display = "none";
        grid.innerHTML = "";
        intervalBox.style.display = "none";
        removeAllBtn.style.display = "none";
        return;
      }

      grid.style.display = "flex";
      removeAllBtn.style.display = "block";
      intervalBox.style.display = promoData.images.length > 1 ? "block" : "none";
      if (intervalInput && document.activeElement !== intervalInput) {
        intervalInput.value = promoData.interval;
      }

      grid.innerHTML = promoData.images.map((src, idx) => `
        <div class="promo-thumb-item">
          <img src="${src}" alt="Affiche ${idx + 1}">
          <button type="button" class="promo-thumb-del" onclick="removeSinglePromo(${idx})">×</button>
        </div>
      `).join("");
    }

    function compressImageFile(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const maxDim = 1000;
            let w = img.width, h = img.height;
            if (w > h && w > maxDim) { h = Math.round((h * maxDim) / w); w = maxDim; }
            else if (h > maxDim) { w = Math.round((w * maxDim) / h); h = maxDim; }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL("image/jpeg", 0.72));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function handlePromoUpload(input) {
      if (!canControlTV()) return;
      const files = Array.from(input.files || []);
      if (!files.length) return;

      const compressedList = await Promise.all(files.map(compressImageFile));
      promoData.images = [...promoData.images, ...compressedList];
      input.value = "";

      promoRef.set(promoData).then(() => {
        alert(compressedList.length > 1 ? `${compressedList.length} affiches ajoutées sur la TV !` : "Affiche ajoutée sur la TV !");
      });
    }

    function removeSinglePromo(idx) {
      if (!canControlTV()) return;
      promoData.images.splice(idx, 1);
      if (promoData.images.length === 0) {
        promoRef.remove();
      } else {
        promoRef.set(promoData);
      }
    }

    function adjPromoInterval(delta) {
      if (!canControlTV()) return;
      promoData.interval = Math.max(2, Math.min(120, (promoData.interval || 10) + delta));
      const el = document.getElementById("val-promoInterval");
      if (el) el.value = promoData.interval;
      promoRef.update({ interval: promoData.interval });
    }

    function manualSetPromoInterval(rawVal) {
      if (!canControlTV() || rawVal === "") return;
      let parsed = parseInt(rawVal);
      if (isNaN(parsed)) parsed = 10;
      promoData.interval = Math.max(2, Math.min(120, parsed));
      promoRef.update({ interval: promoData.interval });
    }

    function removePromoBanner() {
      if (!canControlTV()) return;
      if (confirm("Supprimer toutes les affiches promo de la TV ?")) {
        promoRef.remove().then(() => {
          alert("Affiches retirées. L'horloge revient au centre.");
        });
      }
    }
  </script>
</body>
