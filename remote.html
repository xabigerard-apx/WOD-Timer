<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a0a0a">
  <title>APX Display</title>

  <!-- Icons -->
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500;700&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">

  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #0a0a0a;
      --accent: #e8ff00;
      --accent2: #ff4d00;
      --accent3: #00d4ff;
      --danger: #ff3b30;
      --success: #30d158;
      --text: #ffffff;
      --muted: #777777;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #display-container {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 100vw;
      height: 100vh;
      padding: 2.5vh 3.5vw;
      position: relative;
    }

    .display-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .mode-label {
      font-family: 'DM Mono', monospace;
      font-size: clamp(16px, 2.2vw, 32px);
      letter-spacing: 4px;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
    }

    .round-info {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(28px, 4.5vw, 65px);
      letter-spacing: 2px;
      color: var(--accent);
      line-height: 1;
    }

    /* PASTILLE GÉANTE POUR LE FLOOR */
    .pill-zone {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      margin: 1.2vh 0;
    }

    .pill-badge {
      background: var(--accent);
      color: #000;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(38px, 6vw, 82px);
      letter-spacing: 4px;
      padding: 10px 56px;
      border-radius: 20px;
      line-height: 1;
      text-transform: uppercase;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      text-align: center;
    }

    .digits-zone {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }

    .timer-digits {
      font-family: 'Bebas Neue', sans-serif;
      font-size: min(50vh, 38vw);
      line-height: 0.8;
      color: #fff;
      text-align: center;
      letter-spacing: 2px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 6px 30px rgba(0,0,0,0.9);
    }

    .timer-digits.warning { color: var(--accent2); }
    .timer-digits.critical { color: var(--danger); }

    .status-sub {
      font-family: 'DM Mono', monospace;
      font-size: clamp(14px, 1.8vw, 24px);
      letter-spacing: 3px;
      color: var(--muted);
      margin-top: 14px;
    }

    /* FOOTER & PROGRESS BAR VISIBLE */
    .footer-zone {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 20px;
      background: #1c1c24;
      border: 1px solid #2e2c3d;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.1s linear;
    }

    .laps-preview {
      display: flex;
      gap: 12px;
      overflow: hidden;
      max-height: 42px;
    }

    .lap-tag {
      background: #1c1c24;
      border: 1px solid #2e2c3d;
      border-radius: 8px;
      padding: 6px 14px;
      font-family: 'DM Mono', monospace;
      font-size: clamp(12px, 1.4vw, 18px);
      color: #fff;
    }

    .countdown-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 500;
    }

    .countdown-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(180px, 45vw, 400px);
      color: var(--accent);
      line-height: 0.9;
    }

    .beep-overlay {
      position: fixed;
      inset: 0;
      background: rgba(232, 255, 0, 0.18);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.1s;
      z-index: 200;
    }
    .beep-overlay.flash { opacity: 1; }

    .finish-banner {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 600;
    }
    .finish-banner.active { display: flex; }
    .finish-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(90px, 22vw, 220px);
      color: var(--accent);
      letter-spacing: 6px;
    }
  </style>
</head>
<body onclick="initAudioUserGesture()">

  <div class="beep-overlay" id="beepOverlay"></div>

  <div class="countdown-overlay" id="countdownOverlay">
    <div class="countdown-num" id="countdownNum">3</div>
    <div style="font-family:'DM Mono',monospace; letter-spacing:4px; color:var(--muted); font-size:16px;">GET READY</div>
  </div>

  <div class="finish-banner" id="finishBanner">
    <div class="finish-text">TIME!</div>
  </div>

  <div id="display-container">
    <div class="display-header">
      <div class="mode-label" id="displayMode">READY</div>
      <div class="round-info" id="displayRound">--</div>
    </div>

    <div class="pill-zone">
      <div class="pill-badge" id="displayPhase" style="display:none">WORK</div>
    </div>

    <div class="digits-zone">
      <div class="timer-digits" id="displayDigits">00:00</div>
      <div class="status-sub" id="displaySub">TAP SCREEN TO ACTIVATE AUDIO</div>
    </div>

    <div class="footer-zone">
      <div class="laps-preview" id="displayLaps"></div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC6e1z1cYuq5q9IPGqp1ZLMcv-n0B1ttDo",
      authDomain: "apx-wod-timer.firebaseapp.com",
      databaseURL: "https://apx-wod-timer-default-rtdb.firebaseio.com",
      projectId: "apx-wod-timer",
      storageBucket: "apx-wod-timer.firebasestorage.app",
      messagingSenderId: "798211091297",
      appId: "1:798211091297:web:2333c0480ba17accafb320"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const timerRef = db.ref("timer_state");
    const settingsRef = db.ref("timer_settings");

    let currentSettings = {
      countdown: 3,
      volume: 0.7,
      beep: true,
      flash: true,
      warnAt: 10
    };

    settingsRef.on("value", (snap) => {
      const data = snap.val();
      if (data) {
        currentSettings = { ...currentSettings, ...data };
      }
    });

    let audioCtx = null;
    function getAudio() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function initAudioUserGesture() {
      getAudio();
      requestWakeLock();
      if (!isRunning) {
        document.getElementById('displaySub').textContent = "AUDIO READY · WAITING FOR REMOTE";
      }
    }

    function beep(freq = 880, dur = 0.1, vol = 0.5) {
      try {
        if (!currentSettings.beep) return;
        const ctx = getAudio();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = freq;
        osc.type = 'square';
        gain.gain.setValueAtTime(vol * (currentSettings.volume ?? 0.7), ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + dur);
      } catch(e) {}
    }

    function goBeep() {
      beep(523, 0.15, 0.85);
      setTimeout(() => beep(784, 0.45, 0.95), 160);
    }
    function snapBeep() { beep(1000, 0.05, 0.5); }
    function stopBeep() {
      beep(300, 0.12, 0.8);
      setTimeout(() => beep(200, 0.25, 0.9), 120);
    }
    function flashBeep() {
      if (!currentSettings.flash) return;
      const el = document.getElementById('beepOverlay');
      if (el) {
        el.classList.add('flash');
        setTimeout(() => el.classList.remove('flash'), 120);
      }
    }

    let wakeLock = null;
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch(e) {}
    }

    let currentMode = 'fortime';
    let workoutConfig = {};
    let timerInterval = null;
    let isRunning = false;
    let isPaused = false;
    let startTime = 0;
    let elapsed = 0;
    let pausedAt = 0;
    let totalDuration = 0;
    let currentRound = 1;
    let lastWarnSec = -1;

    let splits = [];
    let lastSplitTime = 0;
    let amrapRounds = 0;
    let currentIntervalIdx = 0;

    let setsState = 'work';
    let setsCurrentSet = 1;
    let setsSetStart = 0;
    let setsRestStart = 0;
    let setsTargetRestMs = 0;
    let setsTimeOffset = 0;

    let lastExecutedCommandTimestamp = Date.now();

    timerRef.on("value", (snapshot) => {
      const data = snapshot.val();
      if (!data || !data.command || (data.timestamp && data.timestamp <= lastExecutedCommandTimestamp)) return;
      lastExecutedCommandTimestamp = data.timestamp;

      const cmd = data.command;

      if (cmd === "CONFIG_AND_START") {
        currentMode = data.mode ? data.mode.toLowerCase().replace(' ', '') : 'fortime';
        workoutConfig = data.config || {};
        startCountdown();
      } else if (cmd === "START") {
        if (isPaused) resumeTimer();
      } else if (cmd === "PAUSE") {
        if (isRunning && !isPaused) pauseTimer();
      } else if (cmd === "RESET") {
        resetToStandby();
      } else if (cmd === "CONTEXT_ACTION") {
        handleContextAction();
      }
    });

    function broadcastState(timeStr, running, modeStr) {
      timerRef.update({
        timeFormatted: timeStr,
        isRunning: running,
        mode: modeStr
      }).catch(() => {});
    }

    function startCountdown() {
      getAudio();
      requestWakeLock();
      clearInterval(timerInterval);
      isPaused = false;
      let count = currentSettings.countdown ?? 3;

      if (count <= 0) {
        goBeep();
        initAndLaunchWorkout();
        return;
      }

      const overlay = document.getElementById('countdownOverlay');
      const numEl = document.getElementById('countdownNum');
      overlay.style.display = 'flex';
      numEl.textContent = count;
      beep(880, 0.12, 0.35);

      const cd = setInterval(() => {
        count--;
        if (count <= 0) {
          clearInterval(cd);
          overlay.style.display = 'none';
          goBeep();
          initAndLaunchWorkout();
        } else {
          numEl.textContent = count;
          beep(880, 0.12, 0.35);
        }
      }, 1000);
    }

    function initAndLaunchWorkout() {
      isRunning = true;
      isPaused = false;
      elapsed = 0;
      startTime = Date.now();
      lastWarnSec = -1;
      splits = [];
      lastSplitTime = 0;
      amrapRounds = 0;
      currentRound = 1;
      currentIntervalIdx = 0;

      document.getElementById('displayLaps').innerHTML = '';
      document.getElementById('displayPhase').style.display = 'block';

      const cfg = workoutConfig;
      const modeLabel = document.getElementById('displayMode');
      const roundInfo = document.getElementById('displayRound');
      const phase = document.getElementById('displayPhase');
      const disp = document.getElementById('displayDigits');
      const sub = document.getElementById('displaySub');

      if (currentMode === 'amrap') {
        totalDuration = (cfg.mins || 10) * 60 * 1000;
        modeLabel.textContent = 'AMRAP';
        phase.textContent = 'AMRAP';
        phase.style.background = 'var(--accent)';
        phase.style.color = '#000';
        roundInfo.textContent = 'ROUND 0';
        disp.textContent = fmtSecs((cfg.mins || 10) * 60);
        sub.textContent = 'RUNNING';
      } else if (currentMode === 'emom') {
        const ivMs = cfg.intervalMs || 60000;
        const totalRds = cfg.rounds || Math.floor(((cfg.mins || 10) * 60 * 1000) / ivMs);
        totalDuration = totalRds * ivMs;
        modeLabel.textContent = 'EMOM';
        phase.textContent = 'EMOM';
        phase.style.background = 'var(--accent3)';
        phase.style.color = '#000';
        roundInfo.textContent = `1 / ${totalRds}`;
        disp.textContent = fmtSecs(Math.ceil(ivMs / 1000));
        sub.textContent = 'RUNNING';
      } else if (currentMode === 'fortime') {
        totalDuration = (cfg.cap > 0) ? cfg.cap * 60 * 1000 : 0;
        modeLabel.textContent = 'FOR TIME';
        phase.textContent = 'FOR TIME';
        phase.style.background = 'var(--accent2)';
        phase.style.color = '#fff';
        roundInfo.textContent = cfg.cap ? `CAP ${cfg.cap}M` : 'NO CAP';
        disp.textContent = "00:00";
        sub.textContent = 'RUNNING';
      } else if (currentMode === 'tabata') {
        const cycle = ((cfg.workSec || 20) + (cfg.tabRestSec || 10)) * 1000;
        totalDuration = (cfg.rounds || 8) * cycle;
        modeLabel.textContent = 'TABATA';
        phase.textContent = 'WORK';
        phase.style.background = 'var(--accent)';
        phase.style.color = '#000';
        roundInfo.textContent = `1 / ${cfg.rounds || 8}`;
        disp.textContent = fmtSecs(cfg.workSec || 20);
        sub.textContent = 'RUNNING';
      } else if (currentMode === 'custom') {
        const rawList = cfg.intervals || [];
        const intervals = Array.isArray(rawList) ? rawList : Object.values(rawList);
        workoutConfig.intervals = intervals;
        const singleLoop = intervals.reduce((s, iv) => s + (parseInt(iv.duration) || 0), 0);
        totalDuration = singleLoop * (parseInt(cfg.loops) || 1);
        modeLabel.textContent = 'CUSTOM';
        roundInfo.textContent = `LOOP 1 / ${cfg.loops || 1}`;
        if (intervals.length > 0) {
          phase.textContent = intervals[0].name;
          phase.style.background = intervals[0].color || 'var(--accent)';
          phase.style.color = '#000';
          disp.textContent = fmtSecs(Math.ceil((parseInt(intervals[0].duration) || 0) / 1000));
          const nextIdx = (1) % intervals.length;
          sub.textContent = `NEXT: ${intervals[nextIdx].name} (${fmtMs(intervals[nextIdx].duration)})`;
        }
      } else if (currentMode === 'sets') {
        setsState = 'work';
        setsCurrentSet = 1;
        setsSetStart = Date.now();
        setsTimeOffset = 0;
        modeLabel.textContent = 'SETS';
        phase.textContent = 'SET 1';
        phase.style.background = 'var(--success)';
        phase.style.color = '#000';
        roundInfo.textContent = `SET 1 / ${cfg.sets || 5}`;
        disp.textContent = "00:00";
        sub.textContent = 'RUNNING';
      }

      timerInterval = setInterval(tick, 100);
      broadcastState(disp.textContent, true, currentMode.toUpperCase());
    }

    function tick() {
      if (isPaused) return;
      const now = Date.now();
      elapsed = now - startTime;
      let formatted = "00:00";

      if (currentMode === 'amrap') {
        const remain = totalDuration - elapsed;
        if (remain <= 0) { finishWorkout(); return; }
        const s = Math.ceil(remain / 1000);
        formatted = fmtSecs(s);
        document.getElementById('displayDigits').textContent = formatted;
        checkWarn(s);
        document.getElementById('progressFill').style.width = `${Math.min(100, (elapsed / totalDuration) * 100)}%`;
      } else if (currentMode === 'emom') {
        if (elapsed >= totalDuration) { finishWorkout(); return; }
        const ivMs = workoutConfig.intervalMs || 60000;
        const round = Math.floor(elapsed / ivMs) + 1;
        const totalRds = workoutConfig.rounds || Math.floor(totalDuration / ivMs);
        if (round !== currentRound) {
          currentRound = round;
          goBeep(); flashBeep();
          document.getElementById('displayRound').textContent = `${round} / ${totalRds}`;
        }
        const remain = ivMs - (elapsed % ivMs);
        const s = Math.ceil(remain / 1000);
        formatted = fmtSecs(s);
        document.getElementById('displayDigits').textContent = formatted;
        checkWarn(s);
        document.getElementById('progressFill').style.width = `${Math.min(100, (elapsed / totalDuration) * 100)}%`;
      } else if (currentMode === 'fortime') {
        if (workoutConfig.cap > 0 && elapsed >= totalDuration) {
          document.getElementById('displayDigits').textContent = fmtMs(totalDuration);
          finishWorkout();
          return;
        }
        formatted = fmtMs(elapsed);
        document.getElementById('displayDigits').textContent = formatted;
        if (workoutConfig.cap > 0) {
          const s = Math.ceil((totalDuration - elapsed) / 1000);
          checkWarn(s);
          document.getElementById('progressFill').style.width = `${Math.min(100, (elapsed / totalDuration) * 100)}%`;
        }
      } else if (currentMode === 'tabata') {
        const wMs = (workoutConfig.workSec || 20) * 1000;
        const rMs = (workoutConfig.tabRestSec || 10) * 1000;
        const cycle = wMs + rMs;
        const round = Math.floor(elapsed / cycle) + 1;
        if (round > (workoutConfig.rounds || 8)) { finishWorkout(); return; }

        const isWork = (elapsed % cycle) < wMs;
        const phase = document.getElementById('displayPhase');
        phase.textContent = isWork ? 'WORK' : 'REST';
        phase.style.background = isWork ? 'var(--accent)' : 'var(--accent3)';
        phase.style.color = '#000';
        const remain = isWork ? wMs - (elapsed % cycle) : cycle - (elapsed % cycle);
        const s = Math.ceil(remain / 1000);
        formatted = fmtSecs(s);
        document.getElementById('displayDigits').textContent = formatted;
        checkWarn(s);
        document.getElementById('progressFill').style.width = `${Math.min(100, (elapsed / totalDuration) * 100)}%`;
      } else if (currentMode === 'custom') {
        const intervals = workoutConfig.intervals || [];
        if (!intervals.length) { finishWorkout(); return; }

        const totalLoop = intervals.reduce((s, iv) => s + (parseInt(iv.duration) || 0), 0);
        const loopIdx = Math.floor(elapsed / totalLoop);
        if (loopIdx >= (parseInt(workoutConfig.loops) || 1)) { finishWorkout(); return; }

        const loopElapsed = elapsed % totalLoop;
        let acc = 0, ivIdx = 0;
        for (let i = 0; i < intervals.length; i++) {
          const dur = parseInt(intervals[i].duration) || 0;
          if (loopElapsed < acc + dur) { ivIdx = i; break; }
          acc += dur;
        }

        if (ivIdx !== currentIntervalIdx) {
          currentIntervalIdx = ivIdx;
          goBeep(); flashBeep();
          const phase = document.getElementById('displayPhase');
          phase.textContent = intervals[ivIdx].name;
          phase.style.background = intervals[ivIdx].color || 'var(--accent)';
          phase.style.color = '#000';
          const nextIdx = (ivIdx + 1) % intervals.length;
          document.getElementById('displaySub').textContent = `NEXT: ${intervals[nextIdx].name} (${fmtMs(intervals[nextIdx].duration)})`;
        }

        const remain = (parseInt(intervals[ivIdx].duration) || 0) - (loopElapsed - acc);
        const s = Math.ceil(remain / 1000);
        document.getElementById('displayRound').textContent = `LOOP ${loopIdx + 1} / ${workoutConfig.loops || 1}`;
        formatted = fmtSecs(s);
        document.getElementById('displayDigits').textContent = formatted;
        checkWarn(s);
        document.getElementById('progressFill').style.width = `${Math.min(100, (elapsed / totalDuration) * 100)}%`;
      } else if (currentMode === 'sets') {
        if (setsState === 'work') {
          const curElapsed = now - setsSetStart - setsTimeOffset;
          formatted = fmtMs(curElapsed);
          document.getElementById('displayDigits').textContent = formatted;
        } else {
          const restElapsed = now - setsRestStart - setsTimeOffset;
          const remaining = setsTargetRestMs - restElapsed;
          if (remaining <= 0) {
            advanceSetsWork();
            return;
          }
          const s = Math.ceil(remaining / 1000);
          formatted = fmtSecs(s);
          document.getElementById('displayDigits').textContent = formatted;
          checkWarn(s);
        }
      }

      broadcastState(formatted, true, currentMode.toUpperCase());
    }

    function checkWarn(s) {
      const warnThreshold = currentSettings.warnAt ?? 10;
      const disp = document.getElementById('displayDigits');
      disp.classList.toggle('warning', s <= warnThreshold && s > 3);
      disp.classList.toggle('critical', s <= 3 && s >= 1);

      if (s <= warnThreshold && s >= 1 && s !== lastWarnSec) {
        lastWarnSec = s;
        snapBeep();
        flashBeep();
      } else if (s > warnThreshold || s <= 0) {
        lastWarnSec = -1;
      }
    }

    function handleContextAction() {
      if (currentMode === 'fortime') {
        const splitDur = elapsed - lastSplitTime;
        lastSplitTime = elapsed;
        splits.push(splitDur);
        snapBeep();
        addLapTag(`S${splits.length}: ${fmtMs(splitDur)}`);
      } else if (currentMode === 'amrap') {
        amrapRounds++;
        snapBeep();
        document.getElementById('displayRound').textContent = `ROUND ${amrapRounds}`;
      } else if (currentMode === 'sets') {
        if (setsState === 'work') {
          const workTime = Date.now() - setsSetStart - setsTimeOffset;
          addLapTag(`Set ${setsCurrentSet}: ${fmtMs(workTime)}`);
          snapBeep(); flashBeep();

          if (setsCurrentSet >= (workoutConfig.sets || 5)) {
            finishWorkout();
            return;
          }

          if (workoutConfig.restType === 'none') {
            setsCurrentSet++;
            setsSetStart = Date.now();
            setsTimeOffset = 0;
            document.getElementById('displayRound').textContent = `SET ${setsCurrentSet} / ${workoutConfig.sets || 5}`;
          } else {
            setsTargetRestMs = (workoutConfig.restType === '1to1') ? workTime : ((workoutConfig.restMin || 2) * 60 + (workoutConfig.restSec || 0)) * 1000;
            setsState = 'rest';
            setsRestStart = Date.now();
            setsTimeOffset = 0;
            setsCurrentSet++;
            const phase = document.getElementById('displayPhase');
            phase.textContent = 'REST';
            phase.style.background = 'var(--accent3)';
            phase.style.color = '#000';
          }
        } else {
          advanceSetsWork();
        }
      }
    }

    function advanceSetsWork() {
      setsState = 'work';
      setsSetStart = Date.now();
      setsTimeOffset = 0;
      goBeep();
      const phase = document.getElementById('displayPhase');
      phase.textContent = `SET ${setsCurrentSet}`;
      phase.style.background = 'var(--success)';
      phase.style.color = '#000';
      document.getElementById('displayRound').textContent = `SET ${setsCurrentSet} / ${workoutConfig.sets || 5}`;
    }

    function addLapTag(text) {
      const container = document.getElementById('displayLaps');
      const tag = document.createElement('div');
      tag.className = 'lap-tag';
      tag.textContent = text;
      container.prepend(tag);
    }

    function pauseTimer() {
      isPaused = true;
      pausedAt = Date.now();
      document.getElementById('displaySub').textContent = "PAUSED";
      broadcastState(document.getElementById('displayDigits').textContent, false, currentMode.toUpperCase());
    }

    function resumeTimer() {
      isPaused = false;
      const diff = Date.now() - pausedAt;
      startTime += diff;
      if (currentMode === 'sets') setsTimeOffset += diff;
      document.getElementById('displaySub').textContent = "RUNNING";
      broadcastState(document.getElementById('displayDigits').textContent, true, currentMode.toUpperCase());
    }

    function resetToStandby() {
      clearInterval(timerInterval);
      isRunning = false;
      isPaused = false;
      stopBeep();
      document.getElementById('displayMode').textContent = "READY";
      document.getElementById('displayRound').textContent = "--";
      document.getElementById('displayPhase').style.display = 'none';
      document.getElementById('displayDigits').textContent = "00:00";
      document.getElementById('displayDigits').className = "timer-digits";
      document.getElementById('displaySub').textContent = "WAITING FOR REMOTE";
      document.getElementById('displayLaps').innerHTML = "";
      document.getElementById('progressFill').style.width = "0%";
      broadcastState("00:00", false, "READY");
    }

    function finishWorkout() {
      clearInterval(timerInterval);
      isRunning = false;
      goBeep();
      broadcastState("00:00", false, currentMode.toUpperCase());
      const banner = document.getElementById('finishBanner');
      banner.classList.add('active');
      setTimeout(() => {
        banner.classList.remove('active');
        document.getElementById('displaySub').textContent = "COMPLETED";
      }, 2000);
    }

    function fmtSecs(s) {
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    }

    function fmtMs(ms) {
      return fmtSecs(Math.floor(ms / 1000));
    }
  </script>
</body>
</html>
