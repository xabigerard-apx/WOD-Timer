<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="APX Remote">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#613795">
  <title>APX Remote</title>

  <!-- Icons & PWA Manifest -->
  <link rel="icon" type="image/png" href="remote-logo.png">
  <link rel="apple-touch-icon" href="remote-logo.png">
  <link rel="manifest" href="manifest-remote.json">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500;700&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #0d0d12;
      --surface: #171720;
      --surface-card: #201f2e;
      --border: #2c2a3e;
      --accent-purple: #8c52ff;
      --accent-amrap: #e8ff00;
      --accent-emom: #00d4ff;
      --accent-fortime: #ff4d00;
      --accent-tabata: #ff2d78;
      --accent-custom: #bf5af2;
      --accent-sets: #30d158;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text: #f3f4f6;
      --muted: #8b889e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-bottom: 24px;
    }

    header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 50;
    }
    .brand-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 26px;
      letter-spacing: 2px;
      color: #fff;
    }
    .brand-title span { color: var(--accent-purple); }

    .status-pill {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      background: #1c1c28;
      border: 1px solid var(--border);
      color: var(--muted);
      transition: all 0.2s;
    }
    .status-pill.online {
      color: #30d158;
      border-color: #30d158;
      background: rgba(48, 209, 88, 0.1);
    }

    /* Top Navigation (Setup vs Saved) */
    .top-nav {
      display: flex;
      gap: 10px;
      padding: 14px 20px 0;
    }
    .nav-btn {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      padding: 10px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .nav-btn.active {
      background: var(--surface-card);
      color: #fff;
      border-color: var(--accent-purple);
    }

    .view-container {
      padding: 16px 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .section-title {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--muted);
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    /* Modes Selection Grid */
    .modes-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .mode-tab {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 12px 6px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }
    .mode-tab.active {
      border-color: var(--active-color, var(--accent-purple));
      background: var(--surface-card);
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    }
    .mode-tab .name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 17px;
      letter-spacing: 1px;
      color: #fff;
      display: block;
    }

    /* Configuration Card */
    .config-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      flex: 1;
    }

    .field-label {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 1.5px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 8px;
      display: block;
    }

    .stepper {
      display: flex;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .step-btn {
      width: 50px;
      height: 48px;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .step-btn:active { background: rgba(255,255,255,0.06); }

    /* Editable Numeric Input */
    .step-val-input {
      flex: 1;
      width: 100%;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      text-align: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      color: #fff;
      letter-spacing: 1px;
      user-select: text;
      -webkit-user-select: text;
      padding: 0;
      margin: 0;
      border-bottom: 2px solid transparent;
      transition: border-color 0.2s, background-color 0.2s;
    }
    .step-val-input:focus {
      background: rgba(140, 82, 255, 0.1);
      border-bottom-color: var(--accent-purple);
    }
    .step-val-input::-webkit-outer-spin-button,
    .step-val-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .step-val-input[type=number] {
      -moz-appearance: textfield;
    }

    .step-unit {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      padding-right: 12px;
      flex-shrink: 0;
    }

    .row-split {
      display: flex;
      gap: 10px;
    }
    .row-split .stepper { flex: 1; }

    .segmented {
      display: flex;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      gap: 4px;
      margin-bottom: 14px;
    }
    .seg-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      padding: 10px 4px;
      border-radius: 7px;
      cursor: pointer;
    }
    .seg-btn.active {
      background: var(--surface-card);
      color: #fff;
    }

    /* Custom Interval Section */
    .custom-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 8px;
    }
    .custom-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .custom-name {
      flex: 1;
      font-size: 13px;
      font-weight: 600;
    }
    .custom-dur {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--muted);
    }
    .btn-add-iv {
      width: 100%;
      background: transparent;
      border: 1px dashed var(--border);
      border-radius: 10px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      padding: 12px;
      cursor: pointer;
      margin-bottom: 14px;
    }

    /* Bottom Action Row */
    .action-row {
      display: flex;
      gap: 10px;
    }
    .btn-launch {
      flex: 2;
      background: linear-gradient(135deg, #30d158, #16a34a);
      color: #000;
      border: none;
      border-radius: 14px;
      padding: 18px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(48, 209, 88, 0.3);
    }
    .btn-save-w {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
    }

    /* SAVED VIEW */
    #view-saved {
      display: none;
      padding: 16px 20px;
      flex: 1;
      flex-direction: column;
    }
    .saved-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .saved-info-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 1px;
      color: #fff;
    }
    .saved-info-meta {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }
    .saved-btns {
      display: flex;
      gap: 8px;
    }
    .saved-load-btn {
      background: var(--accent-purple);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      cursor: pointer;
    }
    .saved-del-btn {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 14px;
      cursor: pointer;
    }

    /* LIVE REMOTE VIEW */
    #view-live {
      display: none;
      padding: 20px;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    .live-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 30px 20px;
      text-align: center;
      margin-bottom: 16px;
    }
    .live-mode-badge {
      display: inline-block;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      letter-spacing: 2px;
      padding: 4px 14px;
      border-radius: 20px;
      background: #252336;
      color: var(--accent-purple);
      margin-bottom: 12px;
    }
    .live-timer-digits {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(80px, 22vw, 110px);
      letter-spacing: 2px;
      line-height: 0.9;
      color: #fff;
      margin: 10px 0;
      font-variant-numeric: tabular-nums;
    }
    .live-status-sub {
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      letter-spacing: 2px;
      color: var(--muted);
    }

    .live-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-contextual {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 14px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      letter-spacing: 2px;
      cursor: pointer;
    }
    .btn-split { background: var(--accent-fortime); color: #fff; }
    .btn-round { background: var(--accent-amrap); color: #000; }
    .btn-set { background: var(--accent-sets); color: #000; }

    .live-row-btns {
      display: flex;
      gap: 10px;
    }
    .btn-pause {
      flex: 1;
      background: var(--warning);
      color: #000;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 1.5px;
      cursor: pointer;
    }
    .btn-stop {
      flex: 1;
      background: #232230;
      color: var(--danger);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 1.5px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">APX <span>REMOTE</span></div>
    <div class="status-pill" id="connPill">Connecting...</div>
  </header>

  <!-- TOP TABS -->
  <div class="top-nav" id="topNav">
    <button class="nav-btn active" id="tabNavSetup" onclick="switchMainTab('setup')">SETUP</button>
    <button class="nav-btn" id="tabNavSaved" onclick="switchMainTab('saved')">⭐ SAVED</button>
  </div>

  <!-- SETUP VIEW -->
  <div class="view-container" id="view-setup">
    <div class="section-title">Workout Mode</div>
    
    <div class="modes-grid">
      <div class="mode-tab active" data-mode="fortime" style="--active-color: var(--accent-fortime)" onclick="selectMode('fortime')">
        <span class="name">FOR TIME</span>
      </div>
      <div class="mode-tab" data-mode="amrap" style="--active-color: var(--accent-amrap)" onclick="selectMode('amrap')">
        <span class="name">AMRAP</span>
      </div>
      <div class="mode-tab" data-mode="emom" style="--active-color: var(--accent-emom)" onclick="selectMode('emom')">
        <span class="name">EMOM</span>
      </div>
      <div class="mode-tab" data-mode="tabata" style="--active-color: var(--accent-tabata)" onclick="selectMode('tabata')">
        <span class="name">TABATA</span>
      </div>
      <div class="mode-tab" data-mode="sets" style="--active-color: var(--accent-sets)" onclick="selectMode('sets')">
        <span class="name">SETS</span>
      </div>
      <div class="mode-tab" data-mode="custom" style="--active-color: var(--accent-custom)" onclick="selectMode('custom')">
        <span class="name">CUSTOM</span>
      </div>
    </div>

    <!-- Dynamic Form Card -->
    <div class="config-card" id="form-container"></div>

    <div class="action-row">
      <button class="btn-save-w" onclick="promptSaveWorkout()">⭐ SAVE</button>
      <button class="btn-launch" onclick="launchWorkoutOnTV()">START ON TV</button>
    </div>
  </div>

  <!-- SAVED TIMERS VIEW -->
  <div id="view-saved">
    <div class="section-title">Saved Workouts</div>
    <div id="savedListContainer" style="flex:1;"></div>
  </div>

  <!-- LIVE TIMER / REMOTE VIEW -->
  <div id="view-live">
    <div class="live-card">
      <div class="live-mode-badge" id="liveBadge">FOR TIME</div>
      <div class="live-timer-digits" id="liveDigits">00:00</div>
      <div class="live-status-sub" id="liveSub">RUNNING</div>
    </div>

    <div class="live-actions">
      <!-- Contextual Action Button -->
      <button class="btn-contextual btn-split" id="btnContextual" onclick="sendContextAction()">SPLIT</button>

      <div class="live-row-btns">
        <button class="btn-pause" id="btnPlayPause" onclick="togglePlayPause()">PAUSE</button>
        <button class="btn-stop" onclick="sendReset()">STOP / RESET</button>
      </div>
    </div>
  </div>

  <script>
    // Firebase Configuration APX
    const firebaseConfig = {
      apiKey: "AIzaSyC6e1z1cYuq5q9IPGqp1ZLMcv-n0B1ttDo",
      authDomain: "apx-wod-timer.firebaseapp.com",
      databaseURL: "https://apx-wod-timer-default-rtdb.firebaseio.com",
      projectId: "apx-wod-timer",
      storageBucket: "apx-wod-timer.firebasestorage.app",
      messagingSenderId: "798211091297",
      appId: "1:798211091297:web:2333c0480ba17accafb320"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const timerRef = db.ref("timer_state");

    let currentMode = 'fortime';
    let config = {
      ftCap: 20,
      ftSplits: true,
      amrapMins: 10,
      emomMins: 10,
      emomRounds: 10,
      emomIvMin: 1,
      emomIvSec: 0,
      tabRounds: 8,
      tabWork: 20,
      tabRest: 10,
      setsCount: 5,
      restType: '1to1',
      restMin: 2,
      restSec: 0,
      customLoops: 1,
      customIntervals: [
        { name: "Work", duration: 30000, color: "#e8ff00" },
        { name: "Rest", duration: 15000, color: "#00d4ff" }
      ]
    };

    let isRunning = false;

    function getEmomIntervalSec() {
      return (config.emomIvMin * 60) + config.emomIvSec || 60;
    }

    // Switch Main Tabs
    function switchMainTab(tab) {
      document.getElementById('tabNavSetup').classList.toggle('active', tab === 'setup');
      document.getElementById('tabNavSaved').classList.toggle('active', tab === 'saved');
      document.getElementById('view-setup').style.display = tab === 'setup' ? 'flex' : 'none';
      document.getElementById('view-saved').style.display = tab === 'saved' ? 'flex' : 'none';
      if (tab === 'saved') renderSavedList();
    }

    // Render Setup Forms
    function renderForm() {
      const c = document.getElementById('form-container');
      if (currentMode === 'fortime') {
        c.innerHTML = `
          <label class="field-label">Time Cap (0 = No Cap)</label>
          <div class="stepper">
            <button class="step-btn" onclick="adj('ftCap', -1, 0, 99)">−</button>
            <input type="number" inputmode="numeric" pattern="[0-9]*" class="step-val-input" id="val-ftCap" value="${config.ftCap}" onfocus="this.select()" oninput="manualSet('ftCap', this.value, 0, 99)">
            <span class="step-unit">MIN</span>
            <button class="step-btn" onclick="adj('ftCap', 1, 0, 99)">+</button>
          </div>
          <label class="field-label">Section Splits</label>
          <div class="segmented">
            <button class="seg-btn ${config.ftSplits ? 'active' : ''}" onclick="setSplits(true)">YES</button>
            <button class="seg-btn ${!config.ftSplits ? 'active' : ''}" onclick="setSplits(false)">NO</button>
          </div>
        `;
      } else if (currentMode === 'amrap') {
        c.innerHTML = `
          <label class="field-label">Duration (Minutes)</label>
          <div class="stepper">
            <button class="step-btn" onclick="adj('amrapMins', -1, 1, 99)">−</button>
            <input type="number" inputmode="numeric" pattern="[0-9]*" class="step-val-input" id="val-amrapMins" value="${config.amrapMins}" onfocus="this.select()" oninput="manualSet('amrapMins', this.value, 1, 99)">
            <span class="step-unit">MIN</span>
            <button class="step-btn" onclick="adj('amrapMins', 1, 1, 99)">+</button>
          </div>
        `;
      } else if (currentMode === 'emom') {
        c.innerHTML = `
          <label class="field-label">Frequency (Every...)</label>
          <div class="row-split">
            <div class="stepper">
              <button class="step-btn" onclick="adjEmomInterval('emomIvMin', -1, 0, 59)">−</button>
              <input type="number" inputmode="numeric" pattern="[0-9]*" class="step-val-input" id="val-emomIvMin" value="${config.emomIvMin}" onfocus="this.select()" oninput="manualSetEmomInterval('emomIvMin', this.value, 0, 59)">
              <span class="step-unit">MIN</span>
              <button class="step-btn" onclick="adjEmomInterval('emomIvMin', 1, 0, 59)">+</button>
            </div>
            <div class="stepper">
              <button class="step-btn" onclick="adjEmomInterval('emomIvSec', -5, 0, 55)">−</button>
              <input type="number" inputmode="numeric" pattern="[0-9]*" class="step-val-input" id="val-emomIvSec" value="${config.emomIvSec}" onfocus="this.select()" oninput="manualSetEmomInterval('emomIvSec', this.value, 0, 55)">
              <span class="step-unit">SEC</span>
              <button class="step-btn" onclick="adjEmomInterval('emomIvSec', 5, 0, 55)">+</button>
            </div>
          </div>

          <label class="field-label">Number of Rounds</label>
          <div class="stepper">
            <button class="step-btn" onclick="adjEmomRounds(-1)">−</button>
            <input type="number" inputmode="numeric" pattern="[0-9]*" class="step-val-input" id="val-emomRounds" value="${config.emomRounds}" onfocus="this.select()" oninput="manualSetEmomRounds(this.value)">
            <span class="step-unit">×</span>
            <button class="step-btn" onclick="adjEmomRounds(1)">+</button>
          </div>

          <label class="field-label">Total Duration</label>
          <div class="stepper" style="border-color: rgba(0, 212, 255, 0.4);">
            <button class="step-btn" onclick="adjEmomMins(-1)">−</button>
            <input type="number" inputmode="numeric" pattern="[0-9]*" class="step-val-input" id="val-emomMins" value="${config.emomMins}" onfocus="this.select()" oninput="manualSetEmomMins(this.value)" style="color: var(--accent-emom);">
            <span class="step-unit" style="color: var(--accent-emom);">MIN</span>
            <button class="step-btn" onclick="adjEmomMins(1)">+</button>
          </div>
        `;
      } else if (currentMode === 'tabata') {
        c.innerHTML = `
          <label class="field-label">Rounds</label>
          <div class="stepper">
            <button class="step-btn" onclick="adj('tabRounds', -1, 1, 30)">−</button>
            <input type="number" inputmode="numeric" pattern="[0-9]*" class="step-val-input" id="val-tabRounds" value="${config.tabRounds}" onfocus="this.select()" oninput="manualSet('tabRounds', this.value, 1, 30)">
            <span class="step-unit">RDS</span>
            <button class="step-btn" onclick="adj('tabRounds', 1, 1, 30)">+</button>
          </div>
          <div class="row-split">
            <div style="flex:1">
              <label class="field-label">Work</label>
              <div class="stepper">
                <button class="step-btn" onclick="adj('tabWork', -5, 5, 180)">−</button>
                <input type="number" inputmode="numeric" pattern="[0-9]*" class="step-val-input" id="val-tabWork" value="${config.tabWork}" onfocus="this.select()" oninput="manualSet('tabWork', this.value, 5, 180)">
                <span class="step-unit">S</span>
                <button class="step-btn" onclick="adj('tabWork', 5, 5, 180)">+</button>
              </div>
            </div>
            <div style="flex:1">
              <label class="field-label">Rest</label>
              <div class="stepper">
                <button class="step-btn" onclick="adj('tabRest', -5, 0, 180)">−</button>
                <input type="number" inputmode="numeric" pattern="[0-9]*" class="step-val-input" id="val-tabRest" value="${config.tabRest}" onfocus="this.select()" oninput="manualSet('tabRest', this.value, 0, 180)">
                <span class="step-unit">S</span>
                <button class="step-btn" onclick="adj('tabRest', 5, 0, 180)">+</button>
              </div>
            </div>
          </div>
        `;
      } else if (currentMode === 'sets') {
        c.innerHTML = `
          <label class="field-label">Number of Sets</label>
          <div class="stepper">
            <button class="step-btn" onclick="adj('setsCount', -1, 1, 30)">−</button>
            <input type="number" inputmode="numeric" pattern="[0-9]*" class="step-val-input" id="val-setsCount" value="${config.setsCount}" onfocus="this.select()" oninput="manualSet('setsCount', this.value, 1, 30)">
            <span class="step-unit">SETS</span>
            <button class="step-btn" onclick="adj('setsCount', 1, 1, 30)">+</button>
          </div>
          <label class="field-label">Rest Mode</label>
          <div class="segmented">
            <button class="seg-btn ${config.restType === '1to1' ? 'active' : ''}" onclick="setRest('1to1')">1:1 REST</button>
            <button class="seg-btn ${config.restType === 'fixed' ? 'active' : ''}" onclick="setRest('fixed')">FIXED</button>
            <button class="seg-btn ${config.restType === 'none' ? 'active' : ''}" onclick="setRest('none')">NONE</button>
          </div>
          <div id="fixed-box" style="display:${config.restType === 'fixed' ? 'flex' : 'none'}; gap:10px;">
            <div class="stepper" style="flex:1">
              <button class="step-btn" onclick="adj('restMin', -1, 0, 59)">−</button>
              <input type="number" inputmode="numeric" pattern="[0-9]*" class="step-val-input" id="val-restMin" value="${config.restMin}" onfocus="this.select()" oninput="manualSet('restMin', this.value, 0, 59)">
              <span class="step-unit">MIN</span>
              <button class="step-btn" onclick="adj('restMin', 1, 0, 59)">+</button>
            </div>
            <div class="stepper" style="flex:1">
              <button class="step-btn" onclick="adj('restSec', -5, 0, 55)">−</button>
              <input type="number" inputmode="numeric" pattern="[0-9]*" class="step-val-input" id="val-restSec" value="${config.restSec}" onfocus="this.select()" oninput="manualSet('restSec', this.value, 0, 59)">
              <span class="step-unit">SEC</span>
              <button class="step-btn" onclick="adj('restSec', 5, 0, 55)">+</button>
            </div>
          </div>
        `;
      } else if (currentMode === 'custom') {
        let ivHtml = config.customIntervals.map((iv, idx) => `
          <div class="custom-item">
            <div class="custom-dot" style="background:${iv.color}"></div>
            <div class="custom-name">${iv.name}</div>
            <div class="custom-dur">${iv.duration / 1000}s</div>
            <button onclick="removeCustomIv(${idx})" style="background:none;border:none;color:var(--danger);font-size:18px;cursor:pointer;">×</button>
          </div>
        `).join('');

        c.innerHTML = `
          <label class="field-label">Loops</label>
          <div class="stepper">
            <button class="step-btn" onclick="adj('customLoops', -1, 1, 30)">−</button>
            <input type="number" inputmode="numeric" pattern="[0-9]*" class="step-val-input" id="val-customLoops" value="${config.customLoops}" onfocus="this.select()" oninput="manualSet('customLoops', this.value, 1, 30)">
            <span class="step-unit">×</span>
            <button class="step-btn" onclick="adj('customLoops', 1, 1, 30)">+</button>
          </div>
          <label class="field-label">Interval Sequence</label>
          <div>${ivHtml || '<div style="color:var(--muted);font-size:12px;margin-bottom:8px;">No intervals created</div>'}</div>
          <button class="btn-add-iv" onclick="addCustomIvPrompt()">+ ADD INTERVAL</button>
        `;
      }
    }

    function selectMode(m) {
      currentMode = m;
      document.querySelectorAll('.mode-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.mode === m);
      });
      renderForm();
    }

    function adj(key, delta, min, max) {
      config[key] = Math.max(min, Math.min(max, (config[key] || 0) + delta));
      const el = document.getElementById(`val-${key}`);
      if (el) el.value = config[key];
    }

    function manualSet(key, rawVal, min, max) {
      if (rawVal === '') return;
      let parsed = parseInt(rawVal);
      if (isNaN(parsed)) parsed = min;
      config[key] = Math.max(min, Math.min(max, parsed));
    }

    // EMOM Bidirectional Logic
    function adjEmomInterval(key, delta, min, max) {
      config[key] = Math.max(min, Math.min(max, (config[key] || 0) + delta));
      if (config.emomIvMin === 0 && config.emomIvSec === 0) config.emomIvSec = 30;
      const el = document.getElementById(`val-${key}`);
      if (el) el.value = config[key];
      recalcEmomMinsFromRounds();
    }

    function manualSetEmomInterval(key, rawVal, min, max) {
      if (rawVal === '') return;
      let parsed = parseInt(rawVal);
      if (isNaN(parsed)) parsed = min;
      config[key] = Math.max(min, Math.min(max, parsed));
      if (config.emomIvMin === 0 && config.emomIvSec === 0) config.emomIvSec = 30;
      recalcEmomMinsFromRounds();
    }

    function adjEmomRounds(delta) {
      config.emomRounds = Math.max(1, Math.min(99, config.emomRounds + delta));
      const el = document.getElementById('val-emomRounds');
      if (el) el.value = config.emomRounds;
      recalcEmomMinsFromRounds();
    }

    function manualSetEmomRounds(rawVal) {
      if (rawVal === '') return;
      let parsed = parseInt(rawVal);
      if (isNaN(parsed)) parsed = 1;
      config.emomRounds = Math.max(1, Math.min(99, parsed));
      recalcEmomMinsFromRounds();
    }

    function recalcEmomMinsFromRounds() {
      const ivSec = getEmomIntervalSec();
      const totalSec = ivSec * config.emomRounds;
      config.emomMins = Math.ceil(totalSec / 60);
      const el = document.getElementById('val-emomMins');
      if (el) el.value = config.emomMins;
    }

    function adjEmomMins(delta) {
      config.emomMins = Math.max(1, Math.min(99, config.emomMins + delta));
      const el = document.getElementById('val-emomMins');
      if (el) el.value = config.emomMins;
      recalcEmomRoundsFromMins();
    }

    function manualSetEmomMins(rawVal) {
      if (rawVal === '') return;
      let parsed = parseInt(rawVal);
      if (isNaN(parsed)) parsed = 1;
      config.emomMins = Math.max(1, Math.min(99, parsed));
      recalcEmomRoundsFromMins();
    }

    function recalcEmomRoundsFromMins() {
      const ivSec = getEmomIntervalSec();
      const totalSec = config.emomMins * 60;
      config.emomRounds = Math.max(1, Math.floor(totalSec / ivSec));
      const el = document.getElementById('val-emomRounds');
      if (el) el.value = config.emomRounds;
    }

    function setSplits(val) {
      config.ftSplits = val;
      renderForm();
    }

    function setRest(val) {
      config.restType = val;
      renderForm();
    }

    function addCustomIvPrompt() {
      const name = prompt("Interval name:", "Work") || "Interval";
      const secs = parseInt(prompt("Duration in seconds:", "30")) || 30;
      config.customIntervals.push({
        name: name,
        duration: secs * 1000,
        color: "#bf5af2"
      });
      renderForm();
    }

    function removeCustomIv(idx) {
      config.customIntervals.splice(idx, 1);
      renderForm();
    }

    // Local Storage Saved Workouts
    function getSavedWorkouts() {
      try { return JSON.parse(localStorage.getItem('apx_saved_workouts') || '[]'); } catch { return []; }
    }

    function promptSaveWorkout() {
      const name = prompt("Workout name (e.g. EMOM 1:30 x 20, Fran, etc.):");
      if (!name) return;
      const saved = getSavedWorkouts();
      saved.unshift({
        id: Date.now(),
        name: name,
        mode: currentMode,
        config: JSON.parse(JSON.stringify(config))
      });
      localStorage.setItem('apx_saved_workouts', JSON.stringify(saved));
      alert("Workout saved!");
    }

    function renderSavedList() {
      const saved = getSavedWorkouts();
      const c = document.getElementById('savedListContainer');
      if (!saved.length) {
        c.innerHTML = `<div style="text-align:center;color:var(--muted);margin-top:40px;font-size:13px;">No saved workouts yet.</div>`;
        return;
      }
      c.innerHTML = saved.map(item => `
        <div class="saved-card">
          <div>
            <div class="saved-info-name">${item.name}</div>
            <div class="saved-info-meta">${item.mode.toUpperCase()}</div>
          </div>
          <div class="saved-btns">
            <button class="saved-load-btn" onclick="loadSavedWorkout(${item.id})">LOAD</button>
            <button class="saved-del-btn" onclick="deleteSavedWorkout(${item.id})">🗑️</button>
          </div>
        </div>
      `).join('');
    }

    function loadSavedWorkout(id) {
      const saved = getSavedWorkouts();
      const found = saved.find(s => s.id === id);
      if (!found) return;
      currentMode = found.mode;
      config = JSON.parse(JSON.stringify(found.config));
      switchMainTab('setup');
      selectMode(currentMode);
    }

    function deleteSavedWorkout(id) {
      let saved = getSavedWorkouts().filter(s => s.id !== id);
      localStorage.setItem('apx_saved_workouts', JSON.stringify(saved));
      renderSavedList();
    }

    // Launch Workout on TV
    function launchWorkoutOnTV() {
      let payload = {
        command: "CONFIG_AND_START",
        mode: currentMode,
        timestamp: Date.now()
      };

      if (currentMode === 'fortime') {
        payload.config = { cap: config.ftCap, splits: config.ftSplits };
      } else if (currentMode === 'amrap') {
        payload.config = { mins: config.amrapMins };
      } else if (currentMode === 'emom') {
        payload.config = { 
          mins: config.emomMins,
          rounds: config.emomRounds,
          ivMin: config.emomIvMin, 
          ivSec: config.emomIvSec,
          intervalMs: getEmomIntervalSec() * 1000
        };
      } else if (currentMode === 'tabata') {
        payload.config = { rounds: config.tabRounds, workSec: config.tabWork, tabRestSec: config.tabRest };
      } else if (currentMode === 'sets') {
        payload.config = { sets: config.setsCount, restType: config.restType, restMin: config.restMin, restSec: config.restSec };
      } else if (currentMode === 'custom') {
        payload.config = { loops: config.customLoops, intervals: config.customIntervals };
      }

      timerRef.update(payload);
    }

    // Realtime Firebase Listener
    timerRef.on("value", (snapshot) => {
      const data = snapshot.val();
      const pill = document.getElementById('connPill');
      pill.innerText = "TV Connected";
      pill.classList.add('online');

      if (!data) return;

      isRunning = data.isRunning || false;
      const viewSetup = document.getElementById('view-setup');
      const viewSaved = document.getElementById('view-saved');
      const viewLive = document.getElementById('view-live');
      const topNav = document.getElementById('topNav');

      if (isRunning || (data.timeFormatted && data.timeFormatted !== "00:00")) {
        topNav.style.display = 'none';
        viewSetup.style.display = 'none';
        viewSaved.style.display = 'none';
        viewLive.style.display = 'flex';

        document.getElementById('liveDigits').innerText = data.timeFormatted || "00:00";
        document.getElementById('liveBadge').innerText = data.mode || currentMode.toUpperCase();
        document.getElementById('liveSub').innerText = isRunning ? "RUNNING" : "PAUSED";

        const playBtn = document.getElementById('btnPlayPause');
        playBtn.innerText = isRunning ? "PAUSE" : "RESUME";
        playBtn.style.background = isRunning ? "var(--warning)" : "var(--accent-sets)";

        const ctxBtn = document.getElementById('btnContextual');
        const activeM = (data.mode || currentMode).toUpperCase();
        if (activeM.includes('TIME')) {
          ctxBtn.style.display = 'block';
          ctxBtn.innerText = "SPLIT";
          ctxBtn.className = "btn-contextual btn-split";
        } else if (activeM.includes('AMRAP')) {
          ctxBtn.style.display = 'block';
          ctxBtn.innerText = "+1 ROUND";
          ctxBtn.className = "btn-contextual btn-round";
        } else if (activeM.includes('SETS')) {
          ctxBtn.style.display = 'block';
          ctxBtn.innerText = "DONE SET / SKIP REST";
          ctxBtn.className = "btn-contextual btn-set";
        } else {
          ctxBtn.style.display = 'none';
        }

      } else {
        topNav.style.display = 'flex';
        viewLive.style.display = 'none';
        if (document.getElementById('tabNavSaved').classList.contains('active')) {
          viewSaved.style.display = 'flex';
          viewSetup.style.display = 'none';
        } else {
          viewSetup.style.display = 'flex';
          viewSaved.style.display = 'none';
        }
      }
    });

    function togglePlayPause() {
      timerRef.update({
        command: isRunning ? "PAUSE" : "START",
        timestamp: Date.now()
      });
    }

    function sendReset() {
      timerRef.update({
        command: "RESET",
        timestamp: Date.now()
      });
    }

    function sendContextAction() {
      timerRef.update({
        command: "CONTEXT_ACTION",
        timestamp: Date.now()
      });
    }

    // Init
    renderForm();
  </script>
</body>
</html>
