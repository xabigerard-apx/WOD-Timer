<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>APX Remote</title>
  <link rel="icon" type="image/png" href="remote-logo.png">
  <link rel="apple-touch-icon" href="remote-logo.png">
  <meta name="theme-color" content="#613795">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: #0d0d11;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    header {
      text-align: center;
      padding-top: 10px;
    }
    header h1 {
      font-size: 1.8rem;
      letter-spacing: 2px;
      color: #ffffff;
    }
    .badge {
      display: inline-block;
      margin-top: 5px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      background: #201a2c;
      color: #b08fe6;
      border: 1px solid #613795;
    }

    /* Sélecteur de mode */
    .mode-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 20px 0;
    }
    .mode-btn {
      background: #181822;
      border: 2px solid #2d2b38;
      color: #aaa;
      padding: 14px 6px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .mode-btn.active {
      border-color: #8c52ff;
      background: #2d1b4e;
      color: #fff;
    }

    /* Zone de statut */
    .status-card {
      background: #14141c;
      border-radius: 16px;
      padding: 25px 20px;
      text-align: center;
      border: 1px solid #232230;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .status-card .timer-preview {
      font-size: 3.5rem;
      font-weight: 800;
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
      color: #ffffff;
      margin: 5px 0;
    }
    .status-card .round-info {
      font-size: 1.1rem;
      color: #9d9bb0;
      font-weight: 600;
    }

    /* Boutons de contrôle géants */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }
    .btn {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 20px;
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .btn:active {
      transform: scale(0.98);
    }

    .btn-start {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #ffffff;
    }
    .btn-pause {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #ffffff;
    }
    .btn-reset {
      background: #252433;
      color: #ef4444;
      border: 1px solid #3b394f;
      padding: 16px;
      font-size: 1rem;
    }
  </style>

  <!-- Firebase SDK compat -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <header>
    <h1>APX REMOTE</h1>
    <div class="badge" id="conn-status">Synchronisation...</div>
  </header>

  <!-- Choix du WOD -->
  <div class="mode-grid">
    <button class="mode-btn active" onclick="setMode('FOR TIME')">FOR TIME</button>
    <button class="mode-btn" onclick="setMode('AMRAP')">AMRAP</button>
    <button class="mode-btn" onclick="setMode('EMOM')">EMOM</button>
  </div>

  <!-- État du Timer -->
  <div class="status-card">
    <div class="round-info" id="current-mode-label">FOR TIME</div>
    <div class="timer-preview" id="display-time">00:00</div>
    <div class="round-info" id="display-status">PRÊT</div>
  </div>

  <!-- Commandes tactiles -->
  <div class="controls">
    <button class="btn btn-start" id="btn-main" onclick="togglePlay()">START</button>
    <button class="btn btn-reset" onclick="sendReset()">RESET TIMER</button>
  </div>

  <script>
    // Configuration Firebase APX
    const firebaseConfig = {
      apiKey: "AIzaSyC6e1z1cYuq5q9IPGqp1ZLMcv-n0B1ttDo",
      authDomain: "apx-wod-timer.firebaseapp.com",
      databaseURL: "https://apx-wod-timer-default-rtdb.firebaseio.com",
      projectId: "apx-wod-timer",
      storageBucket: "apx-wod-timer.firebasestorage.app",
      messagingSenderId: "798211091297",
      appId: "1:798211091297:web:2333c0480ba17accafb320"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const timerRef = db.ref("timer_state");

    let isRunning = false;
    let selectedMode = 'FOR TIME';

    // Écouter l'état réel pour synchroniser la télécommande instantanément
    timerRef.on("value", (snapshot) => {
      const data = snapshot.val();
      document.getElementById('conn-status').innerText = "Connecté à la TV";
      document.getElementById('conn-status').style.borderColor = "#22c55e";

      if (data) {
        isRunning = data.isRunning || false;
        selectedMode = data.mode || 'FOR TIME';
        
        document.getElementById('display-time').innerText = data.timeFormatted || "00:00";
        document.getElementById('display-status').innerText = isRunning ? "EN COURS" : "PAUSE / ARRÊT";
        document.getElementById('current-mode-label').innerText = selectedMode;

        const mainBtn = document.getElementById('btn-main');
        if (isRunning) {
          mainBtn.innerText = "PAUSE";
          mainBtn.className = "btn btn-pause";
        } else {
          mainBtn.innerText = "START";
          mainBtn.className = "btn btn-start";
        }

        // Mettre à jour visuellement les boutons de mode
        document.querySelectorAll('.mode-btn').forEach(btn => {
          btn.classList.toggle('active', btn.innerText === selectedMode);
        });
      }
    });

    // Envoi des commandes
    function togglePlay() {
      if (isRunning) {
        timerRef.update({ command: "PAUSE", timestamp: Date.now() });
      } else {
        timerRef.update({ command: "START", timestamp: Date.now() });
      }
    }

    function sendReset() {
      timerRef.update({ command: "RESET", timestamp: Date.now() });
    }

    function setMode(mode) {
      timerRef.update({ command: "SET_MODE", mode: mode, timestamp: Date.now() });
    }
  </script>
</body>
</html>
