<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="APX Remote">
  <title>APX Remote</title>

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #0d0d12;
      --surface: #17161f;
      --surface2: #211f2d;
      --border: #2e2c3d;
      --accent: #e8ff00;
      --accent2: #ff4d00;
      --accent3: #00d4ff;
      --danger: #ff3b30;
      --success: #30d158;
      --text: #f0f0f5;
      --muted: #8b88a0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .header {
      padding: 20px 20px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 2px;
      color: var(--accent);
    }
    .logo span { color: var(--text); }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      background: var(--surface);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--danger);
    }
    .status-dot.online { background: var(--success); }

    .nav-tabs {
      display: flex;
      background: var(--surface);
      padding: 4px;
      border-bottom: 1px solid var(--border);
      gap: 4px;
    }
    .nav-tab {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: none;
      border-radius: 8px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .nav-tab.active {
      background: var(--surface2);
      color: var(--accent);
    }

    .main-content {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .screen-view { display: none; flex-direction: column; gap: 20px; width: 100%; }
    .screen-view.active { display: flex; }

    /* MIRROR DISPLAY CARD */
    .tv-mirror-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
    }
    .tv-mirror-label {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .tv-mirror-digits {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 64px;
      line-height: 1;
      letter-spacing: 2px;
      color: #fff;
    }
    .tv-mirror-sub {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--accent);
      letter-spacing: 1px;
    }

    /* CONTROLS */
    .remote-ctrl-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .remote-btn {
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .remote-btn:active { transform: scale(0.98); }
    .remote-btn.start-btn {
      grid-column: span 2;
      background: var(--accent);
      color: #000;
      border: none;
      font-size: 24px;
      padding: 18px;
    }
    .remote-btn.danger { color: var(--danger); border-color: var(--danger); }
    .remote-btn.action-btn {
      grid-column: span 2;
      background: var(--success);
      color: #000;
      border: none;
      font-size: 22px;
    }

    /* MODE SELECTOR */
    .mode-select-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .mode-select-btn {
      padding: 12px 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--muted);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      letter-spacing: 1px;
      cursor: pointer;
      text-align: center;
    }
    .mode-select-btn.active {
      background: var(--surface2);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* FORM ELEMENTS WITH DIRECT INPUT */
    .form-group { display: flex; flex-direction: column; gap: 8px; }
    .form-label {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
    }
    .num-input-wrap {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      align-items: center;
      overflow: hidden;
    }
    .num-btn {
      width: 48px; height: 50px;
      background: none; border: none;
      color: var(--muted); font-size: 22px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .num-input-val {
      flex: 1;
      width: 100%;
      min-width: 0;
      background: transparent;
      border: none; outline: none;
      text-align: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 2px;
      color: var(--text);
      padding: 0; margin: 0;
    }
    .num-input-val::-webkit-outer-spin-button,
    .num-input-val::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .num-input-val[type=number] { -moz-appearance: textfield; }
    .num-unit {
      font-size: 11px; color: var(--muted);
      padding-right: 14px; font-family: 'DM Mono', monospace; flex-shrink: 0;
    }

    /* CUSTOM INTERVAL BUILDER */
    .interval-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 6px;
    }
    .interval-pill-name { font-weight: 500; font-size: 14px; }
    .interval-pill-dur { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); }
    .interval-pill-del { background: none; border: none; color: var(--danger); font-size: 18px; cursor: pointer; }

    .color-select { display: flex; gap: 8px; margin-top: 8px; }
    .color-dot { width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
    .color-dot.selected { border-color: #fff; transform: scale(1.1); }

    /* SETTINGS SLIDER */
    .volume-slider {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 6px; border-radius: 3px;
      background: var(--surface2); outline: none; margin-top: 10px;
    }
    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--accent); cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">APX<span>REMOTE</span></div>
    <div class="status-badge">
      <div class="status-dot" id="connDot"></div>
      <span id="connText">TV STANDBY</span>
    </div>
  </div>

  <div class="nav-tabs">
    <button class="nav-tab active" id="tabControl" onclick="switchTab('control')">CONTROLLER</button>
    <button class="nav-tab" id="tabConfigure" onclick="switchTab('configure')">CONFIGURE</button>
    <button class="nav-tab" id="tabSettings" onclick="switchTab('settings')">SETTINGS ⚙️</button>
  </div>

  <div class="main-content">
    <!-- CONTROLLER VIEW -->
    <div class="screen-view active" id="viewControl">
      <div class="tv-mirror-card">
        <div class="tv-mirror-label" id="mirrorMode">WOD TIMER</div>
        <div class="tv-mirror-digits" id="mirrorDigits">00:00</div>
        <div class="tv-mirror-sub" id="mirrorStatus">DISCONNECTED</div>
      </div>

      <div class="remote-ctrl-grid">
        <button class="remote-btn start-btn" onclick="sendCmd('START')">▶ RESUME / START</button>
        <button class="remote-btn" onclick="sendCmd('PAUSE')">⏸ PAUSE</button>
        <button class="remote-btn danger" onclick="sendCmd('RESET')">↺ RESET TV</button>
        <button class="remote-btn action-btn" id="contextActionBtn" onclick="sendCmd('CONTEXT_ACTION')">SPLIT / ROUND</button>
      </div>
    </div>

    <!-- CONFIGURE VIEW -->
    <div class="screen-view" id="viewConfigure">
      <div class="form-label">CHOOSE MODE TO LOAD ON TV</div>
      <div class="mode-select-grid">
        <button class="mode-select-btn active" id="btnModeFortime" onclick="selectMode('fortime')">FOR TIME</button>
        <button class="mode-select-btn" id="btnModeAmrap" onclick="selectMode('amrap')">AMRAP</button>
        <button class="mode-select-btn" id="btnModeEmom" onclick="selectMode('emom')">EMOM</button>
        <button class="mode-select-btn" id="btnModeTabata" onclick="selectMode('tabata')">TABATA</button>
        <button class="mode-select-btn" id="btnModeSets" onclick="selectMode('sets')">SETS</button>
        <button class="mode-select-btn" id="btnModeCustom" onclick="selectMode('custom')">CUSTOM</button>
      </div>

      <div id="configFormContent"></div>

      <button class="remote-btn start-btn" onclick="sendConfigAndStart()">🚀 START ON TV</button>
    </div>

    <!-- SETTINGS VIEW -->
    <div class="screen-view" id="viewSettings">
      <div class="form-group">
        <label class="form-label">COUNTDOWN DURATION</label>
        <div class="num-input-wrap">
          <button class="num-btn" onclick="adjSetting('countdown', -1, 0, 10)">−</button>
          <input type="number" class="num-input-val" id="setCountdown" value="3" onfocus="this.select()">
          <span class="num-unit">SEC</span>
          <button class="num-btn" onclick="adjSetting('countdown', 1, 0, 10)">+</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">WARN WHEN TIME REMAINING</label>
        <div class="num-input-wrap">
          <button class="num-btn" onclick="adjSetting('warnAt', -1, 1, 60)">−</button>
          <input type="number" class="num-input-val" id="setWarnAt" value="10" onfocus="this.select()">
          <span class="num-unit">SEC</span>
          <button class="num-btn" onclick="adjSetting('warnAt', 1, 1, 60)">+</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" style="display:flex; justify-content:space-between;">
          <span>TV BEEP VOLUME</span>
          <span id="setVolumeLabel" style="color:var(--accent);">70%</span>
        </label>
        <input type="range" class="volume-slider" id="setVolume" min="0" max="100" value="70" oninput="document.getElementById('setVolumeLabel').textContent = this.value + '%'">
      </div>

      <div class="form-group" style="flex-direction:row; justify-content:space-between; align-items:center;">
        <span class="form-label">BEEP SOUNDS</span>
        <button class="remote-btn" id="setBeepBtn" onclick="toggleSetting('beep')" style="padding:8px 20px; font-size:16px;">YES</button>
      </div>

      <div class="form-group" style="flex-direction:row; justify-content:space-between; align-items:center;">
        <span class="form-label">SCREEN FLASH</span>
        <button class="remote-btn" id="setFlashBtn" onclick="toggleSetting('flash')" style="padding:8px 20px; font-size:16px;">YES</button>
      </div>

      <button class="remote-btn start-btn" onclick="saveAndSyncSettings()">💾 SAVE & SYNC TO TV</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC6e1z1cYuq5q9IPGqp1ZLMcv-n0B1ttDo",
      authDomain: "apx-wod-timer.firebaseapp.com",
      databaseURL: "https://apx-wod-timer-default-rtdb.firebaseio.com",
      projectId: "apx-wod-timer",
      storageBucket: "apx-wod-timer.firebasestorage.app",
      messagingSenderId: "798211091297",
      appId: "1:798211091297:web:2333c0480ba17accafb320"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const timerRef = db.ref("timer_state");
    const settingsRef = db.ref("timer_settings");

    let configuredMode = 'fortime';
    let customList = [
      { name: 'Work', duration: 30000, color: '#e8ff00' },
      { name: 'Rest', duration: 15000, color: '#00d4ff' }
    ];
    let selectedColor = '#e8ff00';

    timerRef.on("value", (snap) => {
      const data = snap.val();
      if (!data) return;

      document.getElementById('connDot').className = 'status-dot online';
      document.getElementById('connText').textContent = data.isRunning ? 'RUNNING' : 'ONLINE';
      document.getElementById('mirrorDigits').textContent = data.timeFormatted || '00:00';
      document.getElementById('mirrorMode').textContent = data.mode || 'WOD TIMER';
      document.getElementById('mirrorStatus').textContent = data.isRunning ? 'LIVE' : 'PAUSED / READY';

      const btn = document.getElementById('contextActionBtn');
      const m = (data.mode || '').toUpperCase();
      if (m.includes('FOR TIME')) {
        btn.textContent = '⏱ RECORD SPLIT';
        btn.style.display = 'flex';
      } else if (m.includes('AMRAP')) {
        btn.textContent = '🔄 +1 ROUND';
        btn.style.display = 'flex';
      } else if (m.includes('SETS')) {
        btn.textContent = '✅ DONE SET / NEXT';
        btn.style.display = 'flex';
      } else {
        btn.style.display = 'none';
      }
    });

    settingsRef.once("value").then(snap => {
      const s = snap.val();
      if (s) {
        document.getElementById('setCountdown').value = s.countdown ?? 3;
        document.getElementById('setWarnAt').value = s.warnAt ?? 10;
        document.getElementById('setVolume').value = Math.round((s.volume ?? 0.7) * 100);
        document.getElementById('setVolumeLabel').textContent = Math.round((s.volume ?? 0.7) * 100) + '%';
        document.getElementById('setBeepBtn').textContent = (s.beep !== false) ? 'YES' : 'NO';
        document.getElementById('setFlashBtn').textContent = (s.flash !== false) ? 'YES' : 'NO';
      }
    });

    function switchTab(t) {
      document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.screen-view').forEach(v => v.classList.remove('active'));

      if (t === 'control') {
        document.getElementById('tabControl').classList.add('active');
        document.getElementById('viewControl').classList.add('active');
      } else if (t === 'configure') {
        document.getElementById('tabConfigure').classList.add('active');
        document.getElementById('viewConfigure').classList.add('active');
        renderConfigForm();
      } else if (t === 'settings') {
        document.getElementById('tabSettings').classList.add('active');
        document.getElementById('viewSettings').classList.add('active');
      }
    }

    function selectMode(m) {
      configuredMode = m;
      document.querySelectorAll('.mode-select-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById('btnMode' + m.charAt(0).toUpperCase() + m.slice(1));
      if (activeBtn) activeBtn.classList.add('active');
      renderConfigForm();
    }

    function renderConfigForm() {
      const container = document.getElementById('configFormContent');
      if (configuredMode === 'fortime') {
        container.innerHTML = `
          <div class="form-group">
            <label class="form-label">TIME CAP (0 = NO CAP)</label>
            <div class="num-input-wrap">
              <button class="num-btn" onclick="adjVal('ftCap',-1,0,99)">−</button>
              <input type="number" class="num-input-val" id="ftCap" value="15" onfocus="this.select()">
              <span class="num-unit">MIN</span>
              <button class="num-btn" onclick="adjVal('ftCap',1,0,99)">+</button>
            </div>
          </div>`;
      } else if (configuredMode === 'amrap') {
        container.innerHTML = `
          <div class="form-group">
            <label class="form-label">DURATION (MINUTES)</label>
            <div class="num-input-wrap">
              <button class="num-btn" onclick="adjVal('amrapMins',-1,1,99)">−</button>
              <input type="number" class="num-input-val" id="amrapMins" value="12" onfocus="this.select()">
              <span class="num-unit">MIN</span>
              <button class="num-btn" onclick="adjVal('amrapMins',1,1,99)">+</button>
            </div>
          </div>`;
      } else if (configuredMode === 'emom') {
        container.innerHTML = `
          <div class="form-group">
            <label class="form-label">FREQUENCY</label>
            <div style="display:flex; gap:8px;">
              <div class="num-input-wrap" style="flex:1;">
                <button class="num-btn" onclick="adjVal('emomMin',-1,0,59); syncEmomDuration();">−</button>
                <input type="number" class="num-input-val" id="emomMin" value="1" onfocus="this.select()" oninput="syncEmomDuration()">
                <span class="num-unit">MIN</span>
                <button class="num-btn" onclick="adjVal('emomMin',1,0,59); syncEmomDuration();">+</button>
              </div>
              <div class="num-input-wrap" style="flex:1;">
                <button class="num-btn" onclick="adjVal('emomSec',-5,0,55); syncEmomDuration();">−</button>
                <input type="number" class="num-input-val" id="emomSec" value="0" onfocus="this.select()" oninput="syncEmomDuration()">
                <span class="num-unit">SEC</span>
                <button class="num-btn" onclick="adjVal('emomSec',5,0,55); syncEmomDuration();">+</button>
              </div>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">NUMBER OF ROUNDS</label>
            <div class="num-input-wrap">
              <button class="num-btn" onclick="adjVal('emomRounds',-1,1,99); syncEmomDuration();">−</button>
              <input type="number" class="num-input-val" id="emomRounds" value="10" onfocus="this.select()" oninput="syncEmomDuration()">
              <span class="num-unit">RDS</span>
              <button class="num-btn" onclick="adjVal('emomRounds',1,1,99); syncEmomDuration();">+</button>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">TOTAL TIME</label>
            <div class="num-input-wrap" style="border-color:var(--accent3);">
              <button class="num-btn" onclick="adjVal('emomMinsTotal',-1,1,99); syncEmomRounds();">−</button>
              <input type="number" class="num-input-val" id="emomMinsTotal" value="10" onfocus="this.select()" oninput="syncEmomRounds()" style="color:var(--accent3);">
              <span class="num-unit" style="color:var(--accent3);">MIN</span>
              <button class="num-btn" onclick="adjVal('emomMinsTotal',1,1,99); syncEmomRounds();">+</button>
            </div>
          </div>`;
      } else if (configuredMode === 'tabata') {
        container.innerHTML = `
          <div class="form-group">
            <label class="form-label">ROUNDS</label>
            <div class="num-input-wrap">
              <button class="num-btn" onclick="adjVal('tabRounds',-1,1,30)">−</button>
              <input type="number" class="num-input-val" id="tabRounds" value="8" onfocus="this.select()">
              <span class="num-unit">RDS</span>
              <button class="num-btn" onclick="adjVal('tabRounds',1,1,30)">+</button>
            </div>
          </div>
          <div style="display:flex; gap:8px;">
            <div class="num-input-wrap" style="flex:1;">
              <button class="num-btn" onclick="adjVal('tabWork',-5,5,180)">−</button>
              <input type="number" class="num-input-val" id="tabWork" value="20" onfocus="this.select()">
              <span class="num-unit">WORK</span>
              <button class="num-btn" onclick="adjVal('tabWork',5,5,180)">+</button>
            </div>
            <div class="num-input-wrap" style="flex:1;">
              <button class="num-btn" onclick="adjVal('tabRest',-5,0,180)">−</button>
              <input type="number" class="num-input-val" id="tabRest" value="10" onfocus="this.select()">
              <span class="num-unit">REST</span>
              <button class="num-btn" onclick="adjVal('tabRest',5,0,180)">+</button>
            </div>
          </div>`;
      } else if (configuredMode === 'sets') {
        container.innerHTML = `
          <div class="form-group">
            <label class="form-label">NUMBER OF SETS</label>
            <div class="num-input-wrap">
              <button class="num-btn" onclick="adjVal('setsCount',-1,1,30)">−</button>
              <input type="number" class="num-input-val" id="setsCount" value="5" onfocus="this.select()">
              <span class="num-unit">SETS</span>
              <button class="num-btn" onclick="adjVal('setsCount',1,1,30)">+</button>
            </div>
          </div>`;
      } else if (configuredMode === 'custom') {
        renderCustomList();
      }
    }

    function renderCustomList() {
      const container = document.getElementById('configFormContent');
      let itemsHtml = customList.map((iv, i) => `
        <div class="interval-pill">
          <div>
            <div class="interval-pill-name" style="color:${iv.color}">${iv.name}</div>
            <div class="interval-pill-dur">${fmtSecs(iv.duration / 1000)}</div>
          </div>
          <button class="interval-pill-del" onclick="removeCustom(${i})">×</button>
        </div>
      `).join('');

      container.innerHTML = `
        <div class="form-group">
          <label class="form-label">CUSTOM INTERVAL SEQUENCE</label>
          <div>${itemsHtml || '<div style="color:var(--muted);font-size:12px;margin-bottom:8px;">No intervals yet</div>'}</div>
          
          <div style="background:var(--surface); padding:12px; border-radius:12px; border:1px solid var(--border); margin-top:8px;">
            <input type="text" id="customNameInput" placeholder="Name (e.g. Work, Rest, Row...)" style="width:100%; padding:10px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; color:#fff; font-size:14px; margin-bottom:8px; outline:none;">
            <div style="display:flex; gap:8px;">
              <div class="num-input-wrap" style="flex:1;">
                <input type="number" class="num-input-val" id="customSecInput" value="30" onfocus="this.select()">
                <span class="num-unit">SEC</span>
              </div>
              <button class="remote-btn" onclick="addCustomItem()" style="padding:0 20px; font-size:16px; background:var(--accent); color:#000;">+ ADD</button>
            </div>
            <div class="color-select">
              <div class="color-dot selected" data-col="#e8ff00" style="background:#e8ff00;" onclick="selectCol(this)"></div>
              <div class="color-dot" data-col="#00d4ff" style="background:#00d4ff;" onclick="selectCol(this)"></div>
              <div class="color-dot" data-col="#ff4d00" style="background:#ff4d00;" onclick="selectCol(this)"></div>
              <div class="color-dot" data-col="#30d158" style="background:#30d158;" onclick="selectCol(this)"></div>
            </div>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">LOOPS</label>
          <div class="num-input-wrap">
            <button class="num-btn" onclick="adjVal('customLoops',-1,1,30)">−</button>
            <input type="number" class="num-input-val" id="customLoops" value="3" onfocus="this.select()">
            <span class="num-unit">LOOPS</span>
            <button class="num-btn" onclick="adjVal('customLoops',1,1,30)">+</button>
          </div>
        </div>`;
    }

    function selectCol(el) {
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
      el.classList.add('selected');
      selectedColor = el.dataset.col;
    }

    function addCustomItem() {
      const name = document.getElementById('customNameInput').value.trim() || 'Interval';
      const sec = parseInt(document.getElementById('customSecInput').value) || 30;
      customList.push({ name, duration: sec * 1000, color: selectedColor });
      renderCustomList();
    }

    function removeCustom(i) {
      customList.splice(i, 1);
      renderCustomList();
    }

    function adjVal(id, delta, min, max) {
      const el = document.getElementById(id);
      if (!el) return;
      let val = parseInt(el.value || 0) + delta;
      el.value = Math.max(min, Math.min(max, val));
    }

    function syncEmomDuration() {
      const m = parseInt(document.getElementById('emomMin')?.value || 1);
      const s = parseInt(document.getElementById('emomSec')?.value || 0);
      const freq = (m * 60 + s) || 60;
      const rds = parseInt(document.getElementById('emomRounds')?.value || 1);
      const total = Math.ceil((freq * rds) / 60);
      const totalEl = document.getElementById('emomMinsTotal');
      if (totalEl) totalEl.value = total;
    }

    function syncEmomRounds() {
      const m = parseInt(document.getElementById('emomMin')?.value || 1);
      const s = parseInt(document.getElementById('emomSec')?.value || 0);
      const freq = (m * 60 + s) || 60;
      const totalSec = parseInt(document.getElementById('emomMinsTotal')?.value || 1) * 60;
      const rds = Math.max(1, Math.floor(totalSec / freq));
      const rdsEl = document.getElementById('emomRounds');
      if (rdsEl) rdsEl.value = rds;
    }

    function sendCmd(cmd) {
      timerRef.update({
        command: cmd,
        timestamp: Date.now()
      });
    }

    function sendConfigAndStart() {
      let cfg = {};
      if (configuredMode === 'fortime') {
        cfg = { cap: parseInt(document.getElementById('ftCap')?.value || 0) };
      } else if (configuredMode === 'amrap') {
        cfg = { mins: parseInt(document.getElementById('amrapMins')?.value || 10) };
      } else if (configuredMode === 'emom') {
        const m = parseInt(document.getElementById('emomMin')?.value || 1);
        const s = parseInt(document.getElementById('emomSec')?.value || 0);
        cfg = {
          mins: parseInt(document.getElementById('emomMinsTotal')?.value || 10),
          rounds: parseInt(document.getElementById('emomRounds')?.value || 10),
          intervalMs: (m * 60 + s) * 1000 || 60000
        };
      } else if (configuredMode === 'tabata') {
        cfg = {
          rounds: parseInt(document.getElementById('tabRounds')?.value || 8),
          workSec: parseInt(document.getElementById('tabWork')?.value || 20),
          tabRestSec: parseInt(document.getElementById('tabRest')?.value || 10)
        };
      } else if (configuredMode === 'sets') {
        cfg = { sets: parseInt(document.getElementById('setsCount')?.value || 5), restType: '1to1' };
      } else if (configuredMode === 'custom') {
        cfg = {
          intervals: [...customList],
          loops: parseInt(document.getElementById('customLoops')?.value || 1)
        };
      }

      timerRef.update({
        command: "CONFIG_AND_START",
        mode: configuredMode,
        config: cfg,
        timestamp: Date.now()
      });

      switchTab('control');
    }

    function adjSetting(field, delta, min, max) {
      const el = document.getElementById(field === 'countdown' ? 'setCountdown' : 'setWarnAt');
      if (!el) return;
      let val = parseInt(el.value || 0) + delta;
      el.value = Math.max(min, Math.min(max, val));
    }

    function toggleSetting(field) {
      const el = document.getElementById(field === 'beep' ? 'setBeepBtn' : 'setFlashBtn');
      el.textContent = el.textContent === 'YES' ? 'NO' : 'YES';
    }

    function saveAndSyncSettings() {
      const payload = {
        countdown: parseInt(document.getElementById('setCountdown').value) || 3,
        warnAt: parseInt(document.getElementById('setWarnAt').value) || 10,
        volume: parseInt(document.getElementById('setVolume').value) / 100,
        beep: document.getElementById('setBeepBtn').textContent === 'YES',
        flash: document.getElementById('setFlashBtn').textContent === 'YES'
      };

      settingsRef.set(payload).then(() => {
        alert("Settings synced to TV!");
        switchTab('control');
      });
    }

    function fmtSecs(s) {
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    }
  </script>
</body>
</html>
